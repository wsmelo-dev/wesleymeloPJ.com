<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly — Gerenciador de tarefas (demonstração)</title>
  <meta name="description" content="Taskly é um Kanban conceitual para estudo e portfólio: CRUD de tarefas, drag and drop, filtros, atalhos de teclado e dark mode, tudo local.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Taskly — Gerenciador de tarefas (demonstração)">
  <meta property="og:description" content="Projeto demonstrativo de Kanban: dados mockados, estado local, acessível por teclado.">
  <script>try{var t=localStorage.getItem('taskly.theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t}catch(e){}</script>
  <!-- ============================================================
    TASKLY · kanban conceitual (estudo/portfólio)
    Sem Node, sem build. Abrir index.html direto no navegador.
    CDN: React 18 + ReactDOM + Babel. Dados mockados + localStorage.
    Ordem: Configuração → CSS → Dados → Componentes → App
    Acento único: azul #0071E3 (light) / #2997FF (dark)
  ============================================================ -->
  <style>
    :root{
      --bg:#F7F7F9; --surface:#FFFFFF; --surface-2:#F1F1F4;
      --text:#16161A; --text-2:#55555E; --text-3:#82828C;
      --line:rgba(0,0,0,.09); --line-soft:rgba(0,0,0,.055);
      --accent:#0071E3; --accent-ink:#fff; --accent-soft:rgba(0,113,227,.1);
      --danger:#C9343C; --danger-soft:rgba(201,52,60,.1);
      --amber:#B25E09; --amber-soft:rgba(178,94,9,.12);
      --green:#0E9F6E; --green-soft:rgba(14,159,110,.12);
      --nav-bg:rgba(247,247,249,.8);
      --shadow-sm:0 1px 2px rgba(16,16,26,.06);
      --shadow-md:0 10px 34px rgba(16,16,26,.12);
      --r:14px; --r-sm:10px; --pill:999px;
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;
      --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      --ease:cubic-bezier(.16,1,.3,1);
    }
    [data-theme="dark"]{
      --bg:#0B0C0E; --surface:#141619; --surface-2:#1C1F24;
      --text:#F2F4F6; --text-2:#C2C7CD; --text-3:#8E949C;
      --line:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.06);
      --accent:#2997FF; --accent-ink:#06121F; --accent-soft:rgba(41,151,255,.14);
      --danger:#F26D6D; --danger-soft:rgba(242,109,109,.14);
      --amber:#E8A33D; --amber-soft:rgba(232,163,61,.14);
      --green:#3BD97F; --green-soft:rgba(59,217,127,.14);
      --nav-bg:rgba(11,12,14,.72);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 10px 34px rgba(0,0,0,.5);
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5}
    ::selection{background:var(--accent);color:#fff}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
    .skip{position:absolute;left:12px;top:-60px;z-index:300;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--pill);font-size:14px;font-weight:600;text-decoration:none}
    .skip:focus{top:12px}
    button{font:inherit;color:inherit}
    input,select,textarea{font:inherit;color:var(--text)}

    .top{position:sticky;top:0;z-index:60;background:var(--nav-bg);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line-soft)}
    .top-in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .logo{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;letter-spacing:-.02em;text-decoration:none;margin-right:4px}
    .logo-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
    .logo small{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--text-3);border:1px solid var(--line);border-radius:var(--pill);padding:2px 8px}
    .search{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:8px 15px}
    .search input{border:0;background:none;outline:none;width:100%;font-size:14px}
    .search kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--text-3)}
    .sel{background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:8px 12px;font-size:13.5px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--pill);font-weight:650;font-size:14px;padding:10px 20px;cursor:pointer;border:1px solid transparent;transition:transform .2s var(--ease),background .2s}
    .btn:active{transform:scale(.98)}
    .btn-p{background:var(--accent);color:var(--accent-ink)}
    .btn-p:hover{filter:brightness(1.07)}
    .btn-g{background:none;border-color:var(--line);color:var(--text)}
    .btn-g:hover{border-color:var(--accent)}
    .btn-d{background:var(--danger);color:#fff}
    .icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
    .icon-btn:hover{border-color:var(--accent)}

    .wrap{max-width:1280px;margin:0 auto;padding:24px}
    .stats{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
    .stats b{font-size:15px}
    .stats span{font-size:13px;color:var(--text-3)}
    .bar{flex:1;min-width:140px;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
    .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s var(--ease)}
    .late{color:var(--danger);font-weight:650;font-size:13px}

    .tabs{display:none;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
    .tabs button{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer}
    .tabs button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:transparent}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
    .col{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px;min-height:200px;transition:border-color .2s,background .2s}
    .col.over{border-color:var(--accent);background:var(--accent-soft)}
    .col-h{display:flex;align-items:center;gap:8px;padding:2px 6px 12px}
    .col-h h2{font-size:13.5px;margin:0}
    .count{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:1px 9px;color:var(--text-2)}
    .col-h button{margin-left:auto}
    .cards{display:grid;gap:10px;min-height:60px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow-sm);transition:transform .25s var(--ease),box-shadow .25s,border-color .2s}
    .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .card.drag{opacity:.45}
    .card.done{opacity:.75}
    .card.done .t-title{text-decoration:line-through;color:var(--text-3)}
    .card-top{display:flex;align-items:flex-start;gap:8px}
    .check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
    .check[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
    .t-title{font-size:14px;font-weight:650;margin:0;flex:1}
    .t-desc{font-size:13px;color:var(--text-2);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line-soft);background:var(--surface-2);border-radius:var(--pill);padding:3px 10px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
    .chip i{width:7px;height:7px;border-radius:50%}
    .chip.late-chip{border-color:var(--danger);color:var(--danger);font-weight:700}
    .card-acts{display:flex;gap:2px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line-soft)}
    .mini-btn{border:0;background:none;border-radius:8px;padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer}
    .mini-btn:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
    .mini-btn:disabled{opacity:.3;cursor:default}
    .mini-btn.danger{color:var(--danger)}
    .col-empty{border:1.5px dashed var(--line);border-radius:12px;padding:26px 14px;text-align:center;color:var(--text-3);font-size:13px}
    .col-empty b{display:block;color:var(--text-2);margin-bottom:2px}
    .add-col{width:100%;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:11px;font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer;margin-top:10px}
    .add-col:hover{border-color:var(--accent);color:var(--accent)}

    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:120;display:flex;align-items:center;justify-content:center;padding:18px}
    .modal{background:var(--surface);border-radius:20px;width:100%;max-width:480px;box-shadow:var(--shadow-md);max-height:92dvh;overflow:auto}
    .modal.sm{max-width:380px}
    .modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0}
    .modal-h h2{font-size:1.1rem;margin:0}
    .modal form,.modal .mbox{padding:16px 22px 22px;display:grid;gap:14px}
    .field{display:grid;gap:6px;font-size:13.5px;font-weight:600}
    .field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;width:100%;font-family:inherit}
    .field textarea{resize:vertical;min-height:76px}
    .field input[aria-invalid="true"]{border-color:var(--danger)}
    .err{font-size:12.5px;color:var(--danger);font-weight:500}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:grid;gap:10px;max-width:min(360px,calc(100vw - 40px))}
    .toast{background:var(--text);color:var(--bg);border-radius:12px;padding:13px 16px;font-size:13.5px;font-weight:550;box-shadow:var(--shadow-md);display:flex;gap:10px;align-items:center}
    .skel{border-radius:12px;background:linear-gradient(100deg,var(--surface-2) 40%,var(--surface) 50%,var(--surface-2) 60%);background-size:200% 100%;min-height:110px;border:1px solid var(--line-soft)}
    @media (prefers-reduced-motion:no-preference){.skel{animation:sh 1.4s infinite}.toast{animation:tin .35s var(--ease)}@keyframes sh{to{background-position:-200% 0}}@keyframes tin{from{opacity:0;transform:translateY(10px)}}}
    .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--text-3);font-size:12.5px;padding:6px 2px 26px;align-items:center}
    .foot kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface)}
    .foot a{color:var(--text-3)}

    @media(max-width:1080px){.board{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:680px){
      .board{grid-template-columns:1fr}
      .board .col{display:none}
      .board .col.show{display:block}
      .tabs{display:flex}
      .top-in{padding:10px 14px}
      .wrap{padding:16px 14px}
      .row2{grid-template-columns:1fr}
      .hints{display:none}
    }
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
  <a class="skip" href="#conteudo">Pular para o quadro</a>
  <div id="root"></div>
  <noscript><p style="padding:40px;font-family:sans-serif">Taskly precisa de JavaScript para funcionar (demonstração com dados locais).</p></noscript>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef } = React;

    /* ================= DADOS (mockados) ================= */
    const COLS = [
      {id:"backlog",label:"Backlog"},{id:"todo",label:"A fazer"},
      {id:"doing",label:"Em andamento"},{id:"done",label:"Concluído"}
    ];
    const PRIO = {alta:{label:"Alta",color:"#E5484D"},media:{label:"Média",color:"#E8912D"},baixa:{label:"Baixa",color:"#0E9F6E"}};
    const CATS = ["Trabalho","Estudos","Pessoal","Saúde","Projetos"];
    const SEED = [
      {id:"s1",title:"Estudar drag and drop acessível",desc:"Implementar arrastar com alternativa por teclado e leitores de tela.",priority:"alta",cat:"Estudos",date:"2026-10-08",status:"doing"},
      {id:"s2",title:"Revisar fundamentos de React",desc:"Props, estado e efeitos com exercícios práticos.",priority:"alta",cat:"Estudos",date:"2026-10-04",status:"done"},
      {id:"s3",title:"Correr 5km no parque",desc:"Manter a rotina de treinos da semana.",priority:"baixa",cat:"Saúde",date:"2026-10-07",status:"todo"},
      {id:"s4",title:"Organizar repositórios do GitHub",desc:"READMEs, descrições e tópicos em cada projeto.",priority:"media",cat:"Projetos",date:"2026-10-09",status:"todo"},
      {id:"s5",title:"Ler documentação de acessibilidade",desc:"WCAG: foco visível, contraste e nomes acessíveis.",priority:"media",cat:"Estudos",date:"2026-10-03",status:"done"},
      {id:"s6",title:"Planejar estudos de TypeScript",desc:"Tipos básicos, interfaces e generics.",priority:"media",cat:"Estudos",date:"2026-10-12",status:"backlog"},
      {id:"s7",title:"Enviar currículo para estágio",desc:"Adaptar carta de apresentação para a vaga.",priority:"alta",cat:"Trabalho",date:"2026-10-02",status:"todo"},
      {id:"s8",title:"Limpar caixa de e-mail",desc:"Arquivar newsletters antigas.",priority:"baixa",cat:"Pessoal",date:"2026-10-15",status:"backlog"},
      {id:"s9",title:"Exame de rotina",desc:"Agendar check-up anual.",priority:"media",cat:"Saúde",date:"2026-10-20",status:"backlog"},
      {id:"s10",title:"Publicar terceiro estudo",desc:"Subir projeto demonstrativo com README caprichado.",priority:"alta",cat:"Projetos",date:"2026-10-11",status:"doing"}
    ];

    /* ================= UTILS ================= */
    const uid = () => "tk-" + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);
    const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
    const fmtDate = iso => { if(!iso) return "Sem data"; return new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}); };
    const isLate = t => t.date && t.date < todayISO() && t.status!=="done";
    const PRIO_RANK = {alta:0,media:1,baixa:2};
    const Icon = ({d,s=17}) => (<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={d}/></svg>);
    const P = {
      plus:"M12 5v14M5 12h14", x:"M18 6 6 18M6 6l12 12", search:"M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM21 21l-4.3-4.3",
      sun:"M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10ZM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",
      moon:"M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z", pencil:"M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z",
      trash:"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6",
      check:"M20 6 9 17l-5-5", left:"M15 18l-6-6 6-6", right:"M9 18l6-6-6-6",
      flag:"M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7",
      cal:"M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z",
      alert:"M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"
    };

    /* ================= APP ================= */
    function App(){
      const [theme,setTheme] = useState(document.documentElement.dataset.theme||"light");
      const [tasks,setTasks] = useState(()=>{ try{const s=localStorage.getItem("taskly.tasks.v1"); if(s) return JSON.parse(s);}catch(e){} return SEED; });
      const [query,setQuery] = useState("");
      const [fPrio,setFPrio] = useState("todas");
      const [fCat,setFCat] = useState("todas");
      const [sort,setSort] = useState("manual");
      const [modal,setModal] = useState(null); // {mode, task?}
      const [delTarget,setDelTarget] = useState(null);
      const [toasts,setToasts] = useState([]);
      const [dragId,setDragId] = useState(null);
      const [overCol,setOverCol] = useState(null);
      const [mTab,setMTab] = useState("todo");
      const [loading,setLoading] = useState(true);
      const searchRef = useRef(null);
      const openerRef = useRef(null);

      useEffect(()=>{ document.documentElement.dataset.theme=theme; try{localStorage.setItem("taskly.theme",theme)}catch(e){} },[theme]);
      useEffect(()=>{ try{localStorage.setItem("taskly.tasks.v1",JSON.stringify(tasks))}catch(e){} },[tasks]);
      useEffect(()=>{ const t=setTimeout(()=>setLoading(false),600); return ()=>clearTimeout(t); },[]);
      useEffect(()=>{
        const onKey=e=>{
          const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName||"");
          if(e.key==="Escape"){ setModal(null); setDelTarget(null); }
          else if(!typing && e.key==="n"){ e.preventDefault(); openModal("new"); }
          else if(!typing && e.key==="/"){ e.preventDefault(); if(searchRef.current) searchRef.current.focus(); }
        };
        document.addEventListener("keydown",onKey); return ()=>document.removeEventListener("keydown",onKey);
      },[]);

      const toast = msg => { const id=uid(); setToasts(t=>[...t,{id,msg}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3000); };
      const openModal=(mode,task,opener,status)=>{ openerRef.current=opener||document.activeElement; setModal({mode,task:task||null,status:status||null}); };
      const closeModal=()=>{ setModal(null); if(openerRef.current&&openerRef.current.focus) openerRef.current.focus(); };

      const visible = useMemo(()=>{
        const q=query.trim().toLowerCase();
        let list=tasks.filter(t=>(fPrio==="todas"||t.priority===fPrio)&&(fCat==="todas"||t.cat===fCat)&&(!q||(t.title+" "+(t.desc||"")).toLowerCase().includes(q)));
        if(sort==="data") list=[...list].sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
        if(sort==="prioridade") list=[...list].sort((a,b)=>PRIO_RANK[a.priority]-PRIO_RANK[b.priority]);
        return list;
      },[tasks,query,fPrio,fCat,sort]);
      const byCol = id => visible.filter(t=>t.status===id);
      const doneCount = tasks.filter(t=>t.status==="done").length;
      const lateCount = tasks.filter(isLate).length;
      const pct = tasks.length?Math.round(doneCount/tasks.length*100):0;

      const move=(id,dir)=>{
        setTasks(ts=>{
          const t=ts.find(x=>x.id===id); if(!t) return ts;
          const i=COLS.findIndex(c=>c.id===t.status);
          const ni=i+dir; if(ni<0||ni>=COLS.length) return ts;
          toast(`“${t.title}” → ${COLS[ni].label}.`);
          return ts.map(x=>x.id===id?{...x,status:COLS[ni].id}:x);
        });
      };
      const toggleDone=id=>{
        setTasks(ts=>ts.map(x=>{ if(x.id!==id) return x; const to=x.status==="done"?"todo":"done"; return {...x,status:to}; }));
        const t=tasks.find(x=>x.id===id);
        toast(t&&t.status==="done"?"Tarefa reaberta.":"Tarefa concluída. Boa!");
      };
      const cyclePrio=id=>{
        const order=["baixa","media","alta"];
        setTasks(ts=>ts.map(x=>{ if(x.id!==id) return x; const nx=order[(order.indexOf(x.priority)+1)%3]; return {...x,priority:nx}; }));
      };
      const saveTask=draft=>{
        if(modal.mode==="new"){ setTasks(t=>[{...draft,id:uid()},...t]); toast("Tarefa criada."); }
        else { setTasks(t=>t.map(x=>x.id===modal.task.id?{...draft,id:x.id}:x)); toast("Tarefa atualizada."); }
        closeModal();
      };
      const removeTask=()=>{ setTasks(t=>t.filter(x=>x.id!==delTarget.id)); setDelTarget(null); toast("Tarefa excluída."); };
      const onDropCol=colId=>{
        if(!dragId) return;
        setTasks(ts=>ts.map(x=>x.id===dragId?{...x,status:colId}:x));
        const t=tasks.find(x=>x.id===dragId);
        if(t) toast(`“${t.title}” → ${COLS.find(c=>c.id===colId).label}.`);
        setDragId(null); setOverCol(null);
      };

      return (
        <React.Fragment>
          <header className="top">
            <div className="top-in">
              <a className="logo" href="#conteudo"><span className="logo-mark">T</span>Taskly <small>demo</small></a>
              <label className="search"><Icon d={P.search} s={16}/>
                <input ref={searchRef} type="search" placeholder="Pesquisar tarefas…" value={query} onChange={e=>setQuery(e.target.value)} aria-label="Pesquisar tarefas"/>
                <kbd>/</kbd>
              </label>
              <select className="sel" value={fPrio} onChange={e=>setFPrio(e.target.value)} aria-label="Filtrar por prioridade">
                <option value="todas">Prioridade: todas</option>
                <option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option>
              </select>
              <select className="sel" value={fCat} onChange={e=>setFCat(e.target.value)} aria-label="Filtrar por categoria">
                <option value="todas">Categoria: todas</option>
                {CATS.map(c=>(<option key={c}>{c}</option>))}
              </select>
              <select className="sel" value={sort} onChange={e=>setSort(e.target.value)} aria-label="Ordenar tarefas">
                <option value="manual">Ordem manual</option><option value="data">Por data</option><option value="prioridade">Por prioridade</option>
              </select>
              <button className="btn btn-p" onClick={e=>openModal("new",null,e.currentTarget)}><Icon d={P.plus} s={16}/> Nova</button>
              <button className="icon-btn" onClick={()=>setTheme(t=>t==="light"?"dark":"light")} aria-label={theme==="light"?"Ativar modo escuro":"Ativar modo claro"}><Icon d={theme==="light"?P.moon:P.sun}/></button>
            </div>
          </header>

          <main className="wrap" id="conteudo">
            <section className="stats" aria-label="Resumo">
              <div><b>{doneCount}/{tasks.length}</b> <span>concluídas</span></div>
              <div className="bar" role="progressbar" aria-valuenow={pct} aria-valuemin="0" aria-valuemax="100" aria-label={`${pct}% concluído`}><i style={{width:pct+"%"}}/></div>
              <span>{pct}%</span>
              {lateCount>0 && <span className="late"><Icon d={P.alert} s={14}/> {lateCount} em atraso</span>}
            </section>

            <div className="tabs" role="group" aria-label="Colunas">
              {COLS.map(c=>(
                <button key={c.id} aria-pressed={mTab===c.id} onClick={()=>setMTab(c.id)}>
                  {c.label} · {byCol(c.id).length}
                </button>
              ))}
            </div>

            {loading ? (
              <div className="board" aria-hidden="true">
                {[0,1,2,3].map(i=>(<div key={i} className="col"><div className="skel"/><div style={{height:10}}/><div className="skel"/></div>))}
              </div>
            ) : (
              <div className="board">
                {COLS.map(c=>{
                  const list=byCol(c.id);
                  return (
                    <section key={c.id} className={"col"+(overCol===c.id?" over":"")+(mTab===c.id?" show":"")}
                      aria-labelledby={"col-"+c.id}
                      onDragOver={e=>{e.preventDefault();setOverCol(c.id);}}
                      onDragLeave={()=>setOverCol(o=>o===c.id?null:o)}
                      onDrop={e=>{e.preventDefault();onDropCol(c.id);}}>
                      <div className="col-h">
                        <h2 id={"col-"+c.id}>{c.label}</h2>
                        <span className="count">{list.length}</span>
                        <button className="mini-btn" onClick={e=>{openModal("new",null,e.currentTarget,c.id);}} aria-label={"Nova tarefa em "+c.label}><Icon d={P.plus} s={15}/></button>
                      </div>
                      <div className="cards">
                        {list.length===0 ? (
                          <div className="col-empty"><b>Nada por aqui</b>Arraste um card ou crie uma tarefa.</div>
                        ) : list.map(t=>(
                          <TaskCard key={t.id} t={t} drag={dragId===t.id}
                            onDragStart={e=>{e.dataTransfer.setData("text/plain",t.id);setDragId(t.id);}}
                            onDragEnd={()=>{setDragId(null);setOverCol(null);}}
                            onToggle={()=>toggleDone(t.id)}
                            onCycle={()=>cyclePrio(t.id)}
                            onMove={dir=>move(t.id,dir)}
                            onEdit={e=>openModal("edit",t,e.currentTarget)}
                            onDel={()=>setDelTarget(t)} />
                        ))}
                      </div>
                      <button className="add-col" onClick={e=>openModal("new",null,e.currentTarget,c.id)}>+ Adicionar tarefa</button>
                    </section>
                  );
                })}
              </div>
            )}

            <footer className="foot">
              <span className="hints"><kbd>N</kbd> nova tarefa · <kbd>/</kbd> pesquisar · <kbd>Esc</kbd> fechar · dados fictícios salvos neste navegador</span>
              <a href="../index.html">← Voltar ao portfólio</a>
            </footer>
          </main>

          {modal && <TaskModal mode={modal.mode} task={modal.task} presetCol={modal.status||mTab} onClose={closeModal} onSave={saveTask}/>}
          {delTarget && (
            <div className="overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) setDelTarget(null); }}>
              <div className="modal sm" role="alertdialog" aria-modal="true" aria-labelledby="del-t" aria-describedby="del-d">
                <div className="modal-h"><h2 id="del-t">Excluir tarefa?</h2></div>
                <div className="mbox">
                  <p id="del-d" style={{margin:0,fontSize:14,color:"var(--text-2)"}}>“{delTarget.title}” será removida permanentemente. Essa ação não pode ser desfeita.</p>
                  <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
                    <button className="btn btn-g" onClick={()=>setDelTarget(null)}>Cancelar</button>
                    <button className="btn btn-d" onClick={removeTask}>Excluir</button>
                  </div>
                </div>
              </div>
            </div>
          )}
          <div className="toasts" aria-live="polite">
            {toasts.map(t=>(<div className="toast" key={t.id} role="status"><Icon d={P.check} s={16}/> {t.msg}</div>))}
          </div>
        </React.Fragment>
      );
    }

    /* ============ CARD ============ */
    function TaskCard({t,drag,onDragStart,onDragEnd,onToggle,onCycle,onMove,onEdit,onDel}){
      const ci=COLS.findIndex(c=>c.id===t.status);
      const late=isLate(t);
      return (
        <article className={"card"+(t.status==="done"?" done":"")+(drag?" drag":"")}
          draggable onDragStart={onDragStart} onDragEnd={onDragEnd} aria-label={t.title}>
          <div className="card-top">
            <button className="check" aria-pressed={t.status==="done"} onClick={onToggle} aria-label={t.status==="done"?"Reabrir "+t.title:"Concluir "+t.title}>
              {t.status==="done" && <Icon d={P.check} s={12}/>}
            </button>
            <h3 className="t-title">{t.title}</h3>
          </div>
          {t.desc && <p className="t-desc">{t.desc}</p>}
          <div className="chips">
            <button className="chip" onClick={onCycle} aria-label={"Alterar prioridade de "+t.title+" (atual: "+PRIO[t.priority].label+")"} title="Clique para alternar prioridade">
              <i style={{background:PRIO[t.priority].color}}/>{PRIO[t.priority].label}
            </button>
            <span className="chip">{t.cat}</span>
            <span className={"chip"+(late?" late-chip":"")}><Icon d={P.cal} s={11}/>{fmtDate(t.date)}{late?" · em atraso":""}</span>
          </div>
          <div className="card-acts">
            <button className="mini-btn" onClick={()=>onMove(-1)} disabled={ci===0} aria-label={"Mover "+t.title+" para "+(COLS[ci-1]?COLS[ci-1].label:"")}><Icon d={P.left} s={14}/></button>
            <button className="mini-btn" onClick={()=>onMove(1)} disabled={ci===COLS.length-1} aria-label={"Mover "+t.title+" para "+(COLS[ci+1]?COLS[ci+1].label:"")}><Icon d={P.right} s={14}/></button>
            <span style={{flex:1}}/>
            <button className="mini-btn" onClick={onEdit} aria-label={"Editar "+t.title}><Icon d={P.pencil} s={14}/></button>
            <button className="mini-btn danger" onClick={onDel} aria-label={"Excluir "+t.title}><Icon d={P.trash} s={14}/></button>
          </div>
        </article>
      );
    }

    /* ============ MODAL DE TAREFA ============ */
    function TaskModal({mode,task,presetCol,onClose,onSave}){
      const isNew=mode==="new";
      const [title,setTitle]=useState(task?task.title:"");
      const [desc,setDesc]=useState(task?(task.desc||""):"");
      const [priority,setPriority]=useState(task?task.priority:"media");
      const [cat,setCat]=useState(task?task.cat:CATS[0]);
      const [date,setDate]=useState(task?(task.date||todayISO()):todayISO());
      const [status,setStatus]=useState(task?task.status:(presetCol||"todo"));
      const [err,setErr]=useState("");
      const firstRef=useRef(null);
      useEffect(()=>{ if(firstRef.current) firstRef.current.focus(); },[]);
      useEffect(()=>{ const k=e=>{ if(e.key==="Escape") onClose(); }; document.addEventListener("keydown",k); return ()=>document.removeEventListener("keydown",k); },[]);
      const submit=e=>{
        e.preventDefault();
        if(!title.trim()){ setErr("Dê um título para a tarefa."); return; }
        onSave({title:title.trim(),desc:desc.trim(),priority,cat,date:date||null,status});
      };
      return (
        <div className="overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
          <div className="modal" role="dialog" aria-modal="true" aria-labelledby="tm-t">
            <div className="modal-h"><h2 id="tm-t">{isNew?"Nova tarefa":"Editar tarefa"}</h2>
              <button className="icon-btn" onClick={onClose} aria-label="Fechar"><Icon d={P.x}/></button></div>
            <form onSubmit={submit} noValidate>
              <label className="field">Título
                <input ref={firstRef} value={title} onChange={e=>{setTitle(e.target.value);setErr("");}} placeholder="Ex.: Revisar pull request" aria-invalid={!!err} aria-describedby={err?"tm-err":undefined}/>
                {err && <span className="err" id="tm-err">{err}</span>}
              </label>
              <label className="field">Descrição <span style={{fontWeight:400,color:"var(--text-3)"}}>(opcional)</span>
                <textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Contexto, critérios, links…"/>
              </label>
              <div className="row2">
                <label className="field">Prioridade
                  <select value={priority} onChange={e=>setPriority(e.target.value)}>
                    <option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option>
                  </select>
                </label>
                <label className="field">Categoria
                  <select value={cat} onChange={e=>setCat(e.target.value)}>{CATS.map(c=>(<option key={c}>{c}</option>))}</select>
                </label>
              </div>
              <div className="row2">
                <label className="field">Data
                  <input type="date" value={date||""} onChange={e=>setDate(e.target.value)}/>
                </label>
                <label className="field">Coluna
                  <select value={status} onChange={e=>setStatus(e.target.value)}>{COLS.map(c=>(<option key={c.id} value={c.id}>{c.label}</option>))}</select>
                </label>
              </div>
              <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
                <button type="button" className="btn btn-g" onClick={onClose}>Cancelar</button>
                <button type="submit" className="btn btn-p">{isNew?"Criar tarefa":"Salvar"}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
