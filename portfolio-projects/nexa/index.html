<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa — Seu trabalho. Finalmente organizado. (demonstração)</title>
  <meta name="description" content="Nexa é uma landing page conceitual de um SaaS fictício, criada para estudo e portfólio: hero, recursos, preços, FAQ e dark mode.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Nexa — landing page demonstrativa de SaaS fictício">
  <meta property="og:description" content="Projeto conceitual para portfólio. Produto, marcas e depoimentos são fictícios.">
  <script>try{var t=localStorage.getItem('nexa.theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t}catch(e){}</script>
  <!-- ============================================================
    NEXA · landing page de SaaS FICTÍCIO (estudo/portfólio)
    Sem Node, sem build. Abrir index.html direto no navegador.
    CDN: React 18 + ReactDOM + Babel. Sem backend, tudo local.
    Ordem: Configuração → CSS → Dados → Componentes → App
    Acento único: laranja contido #D9480F (light) / #FF8A3D (dark)
    Marcas, depoimentos e métricas: fictícios, sinalizados no texto.
  ============================================================ -->
  <style>
    :root{
      --bg:#FBFBFD; --bg-soft:#F5F5F7; --surface:#FFFFFF; --surface-2:#F5F5F7;
      --text:#1D1D1F; --text-2:#515154; --text-3:#6E6E73;
      --line:rgba(0,0,0,.09); --line-soft:rgba(0,0,0,.06);
      --accent:#D9480F; --accent-hover:#E85A17; --accent-ink:#fff; --accent-soft:rgba(217,72,15,.09);
      --nav-bg:rgba(251,251,253,.72);
      --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 10px 34px rgba(0,0,0,.09); --shadow-lg:0 26px 70px rgba(0,0,0,.13);
      --r:18px; --r-sm:12px; --pill:999px;
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;
      --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      --ease:cubic-bezier(.16,1,.3,1); --max:1120px; --nav-h:64px;
    }
    [data-theme="dark"]{
      --bg:#0D0C0B; --bg-soft:#141312; --surface:#171615; --surface-2:#1E1D1C;
      --text:#F5F4F2; --text-2:#C7C4C0; --text-3:#98948F;
      --line:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.07);
      --accent:#FF8A3D; --accent-hover:#FF9A55; --accent-ink:#2A1404; --accent-soft:rgba(255,138,61,.14);
      --nav-bg:rgba(13,12,11,.7);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 34px rgba(0,0,0,.5); --shadow-lg:0 26px 70px rgba(0,0,0,.55);
    }
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 14px)}
    body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5}
    ::selection{background:var(--accent);color:#fff}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
    .skip{position:absolute;left:14px;top:-60px;z-index:300;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--pill);font-size:14px;font-weight:600;text-decoration:none}
    .skip:focus{top:12px}
    button{font:inherit;color:inherit}
    input{font:inherit;color:var(--text)}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
    h1,h2,h3{letter-spacing:-.03em;line-height:1.07;margin:0;text-wrap:balance}
    h1{font-size:clamp(2.4rem,5vw,3.9rem);font-weight:750}
    h2{font-size:clamp(1.7rem,3.2vw,2.4rem);font-weight:750}
    .lede{color:var(--text-2);font-size:clamp(1rem,1.4vw,1.12rem);line-height:1.65;max-width:60ch}
    section{padding:88px 0}
    .demo-note{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}

    .nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:100;border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
    .nav.scrolled{background:var(--nav-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--line-soft)}
    .nav-in{max-width:var(--max);margin:0 auto;padding:0 24px;height:var(--nav-h);display:flex;align-items:center;gap:8px}
    .brand{font-weight:750;font-size:17px;text-decoration:none;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;margin-right:12px}
    .brand i{width:28px;height:28px;border-radius:8px;background:var(--text);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;font-weight:800}
    .links{display:flex;gap:2px;list-style:none;margin:0;padding:0}
    .links a{text-decoration:none;font-size:14px;font-weight:500;color:var(--text-2);padding:8px 13px;border-radius:var(--pill)}
    .links a:hover{background:var(--accent-soft);color:var(--text)}
    .nav-act{margin-left:auto;display:flex;gap:8px;align-items:center}
    .icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
    .icon-btn:hover{border-color:var(--accent)}
    .menu-btn{display:none}
    .m-panel{display:none}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 28px;border-radius:var(--pill);font-size:15px;font-weight:650;text-decoration:none;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:transform .25s var(--ease),background .2s,box-shadow .25s}
    .btn:active{transform:scale(.98)}
    .btn-p{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 22px rgba(217,72,15,.25)}
    .btn-p:hover{background:var(--accent-hover)}
    .btn-g{background:transparent;color:var(--text);border-color:var(--line)}
    .btn-g:hover{border-color:var(--accent)}
    .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}

    .hero{padding:calc(var(--nav-h) + 64px) 0 60px;position:relative;overflow:clip;text-align:center}
    .hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(720px 380px at 50% -60px, var(--accent-soft), transparent 70%)}
    .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);padding:7px 16px;font-size:13px;font-weight:550;color:var(--text-2);box-shadow:var(--shadow-sm)}
    .pill b{color:var(--accent)}
    .hero h1{max-width:16ch;margin:22px auto 0}
    .hero .lede{margin:18px auto 0}
    .hero .btn-row{justify-content:center}
    .mock{margin:52px auto 0;max-width:880px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;text-align:left}
    .mock-bar{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid var(--line-soft)}
    .mock-bar i{width:11px;height:11px;border-radius:50%}
    .mock-bar i:nth-child(1){background:#FF5F57}.mock-bar i:nth-child(2){background:#FEBC2E}.mock-bar i:nth-child(3){background:#28C840}
    .mock-bar code{font-family:var(--mono);font-size:12px;color:var(--text-3);margin-left:8px}
    .mock-body{display:grid;grid-template-columns:200px 1fr;min-height:300px}
    .mock-side{border-right:1px solid var(--line-soft);padding:18px 14px;display:grid;gap:4px;align-content:start}
    .mock-side span{font-size:13px;padding:8px 12px;border-radius:8px;color:var(--text-2)}
    .mock-side span.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
    .mock-main{padding:20px;display:grid;gap:12px;align-content:start}
    .m-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .m-kpis div{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px}
    .m-kpis small{font-size:11px;color:var(--text-3);display:block}
    .m-kpis b{font-size:16px}
    .m-rows{display:grid;gap:8px}
    .m-rows div{display:flex;align-items:center;gap:10px;font-size:13px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}
    .mdot{width:9px;height:9px;border-radius:50%;flex:none}
    .float-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:880px;margin:14px auto 0}
    .float-cards div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px;box-shadow:var(--shadow-sm);text-align:left}
    .float-cards b{display:block;font-size:13.5px}

    .logos{padding:34px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);background:var(--bg-soft)}
    .logo-row{display:flex;gap:34px;justify-content:center;flex-wrap:wrap;align-items:center;margin-top:20px}
    .logo-row span{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:var(--text-3)}
    .logo-row svg{flex:none}

    .feat-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:36px}
    .feat-grid .stack{display:grid;gap:16px;align-content:start}
    .feat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s}
    .feat:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
    .feat .fic{width:42px;height:42px;border-radius:13px;background:var(--accent-soft);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px}
    .feat h3{font-size:17px;margin-bottom:8px}
    .feat p{font-size:14.5px;color:var(--text-2);margin:0;line-height:1.65}
    .feat.tint{background:var(--surface-2)}
    .feat .mini-bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:18px}
    .feat .mini-bars i{flex:1;border-radius:5px;background:var(--line);min-height:10px}
    .feat .mini-bars i.f{background:var(--accent)}

    .show-tabs{display:flex;gap:8px;margin:26px 0 18px;flex-wrap:wrap}
    .show-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);padding:10px 20px;font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer}
    .show-tabs button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:transparent}
    .show-pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:26px;min-height:240px}
    .show-pane h3{margin-bottom:6px}
    .show-pane p{color:var(--text-2);font-size:14.5px;max-width:62ch}
    .show-ui{margin-top:18px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:18px;display:grid;gap:10px}
    .show-ui .r{display:flex;justify-content:space-between;font-size:13px;background:var(--surface);border:1px solid var(--line-soft);border-radius:9px;padding:10px 14px}

    .bene{list-style:none;margin:34px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--line-soft)}
    .bene li{display:grid;grid-template-columns:64px 1fr;gap:6px 16px;padding:26px 26px 26px 0;border-bottom:1px solid var(--line-soft)}
    .bene li:nth-child(even){padding-left:26px;border-left:1px solid var(--line-soft)}
    .bene b.num{font-family:var(--mono);font-size:13px;color:var(--accent)}
    .bene h3{font-size:16px}.bene p{font-size:14px;color:var(--text-2);margin:6px 0 0;grid-column:2}

    .int-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
    .int{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:20px;display:grid;gap:8px}
    .int b{font-size:15px;display:flex;align-items:center;gap:10px}
    .int b i{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:16px}
    .int p{font-size:13.5px;color:var(--text-2);margin:0}
    .int button{justify-self:start;border:1px solid var(--line);background:none;border-radius:var(--pill);padding:8px 18px;font-size:13px;font-weight:650;cursor:pointer;color:var(--accent)}
    .int button:hover{background:var(--accent-soft);border-color:var(--accent)}

    .quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
    .quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:12px}
    .quote p{font-size:14.5px;line-height:1.65;margin:0}
    .quote footer{margin-top:auto;font-size:13px;color:var(--text-3)}
    .quote footer b{color:var(--text);display:block;font-size:14px}
    .fict{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:var(--pill);padding:2px 10px;color:var(--text-3);align-self:flex-start}

    .billing{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:24px;font-size:14px;font-weight:600}
    .switch{position:relative;width:52px;height:30px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
    .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text);transition:left .25s var(--ease)}
    .switch[aria-checked="true"]::after{left:25px}
    .save{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:var(--pill);padding:3px 10px}
    .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;align-items:stretch}
    .plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:30px 28px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
    .plan.hot{border:2px solid var(--accent);box-shadow:var(--shadow-md);position:relative}
    .plan.hot::before{content:"Mais popular";position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;border-radius:var(--pill);padding:4px 14px;white-space:nowrap}
    .plan h3{font-size:17px}
    .plan .price{font-size:2.2rem;font-weight:750;letter-spacing:-.03em;margin:12px 0 2px}
    .plan .per{font-size:13px;color:var(--text-3)}
    .plan ul{list-style:none;margin:20px 0 24px;padding:0;display:grid;gap:10px;font-size:14px;color:var(--text-2)}
    .plan li{display:flex;gap:9px;align-items:flex-start}
    .plan li i{color:var(--accent);font-style:normal;font-weight:800}
    .plan .btn{margin-top:auto}

    .faq{max-width:720px;margin:30px auto 0;display:grid;gap:10px}
    .faq-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .faq-item button{width:100%;background:none;border:0;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;font-size:15px;font-weight:650;cursor:pointer;text-align:left}
    .faq-item button span:last-child{color:var(--accent);font-size:18px;flex:none;transition:transform .25s var(--ease)}
    .faq-item button[aria-expanded="true"] span:last-child{transform:rotate(45deg)}
    .faq-a{padding:0 20px 20px;font-size:14.5px;color:var(--text-2);margin:0;line-height:1.65}

    .final{background:var(--text);color:var(--bg);border-radius:24px;padding:clamp(40px,6vw,72px);text-align:center;margin-top:20px}
    .final h2{max-width:18ch;margin:0 auto}
    .final p{opacity:.7;margin:16px auto 0;max-width:52ch}
    .final .btn-row{justify-content:center}
    .final .btn-g{color:var(--bg);border-color:rgba(128,128,128,.4)}
    .news{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
    .news input{background:rgba(128,128,128,.15);border:1px solid rgba(128,128,128,.35);border-radius:var(--pill);padding:13px 20px;font-size:14px;color:var(--bg);min-width:min(280px,80vw);outline:none}
    .news input::placeholder{color:inherit;opacity:.55}
    .news .errn{flex-basis:100%;font-size:13px;color:#FF9A8A}
    footer.site{border-top:1px solid var(--line-soft);padding:52px 0 30px;background:var(--bg-soft)}
    .f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px}
    .f-grid h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-bottom:14px;font-family:var(--mono);font-weight:500}
    .f-grid ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14px}
    .f-grid a{color:var(--text-2);text-decoration:none}
    .f-grid a:hover{color:var(--accent)}
    .f-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:22px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--text-3)}
    .soc{display:flex;gap:8px}
    .soc button{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:14px;font-weight:700}
    .soc button:hover{border-color:var(--accent);color:var(--accent)}

    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:18px}
    .modal{background:var(--surface);border-radius:20px;width:100%;max-width:440px;box-shadow:var(--shadow-lg);max-height:92dvh;overflow:auto}
    .modal-h{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 0}
    .modal form,.mbox{padding:16px 24px 24px;display:grid;gap:14px}
    .field{display:grid;gap:6px;font-size:13.5px;font-weight:600}
    .field input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;width:100%}
    .field input[aria-invalid="true"]{border-color:#C9343C}
    .err{font-size:12.5px;color:#C9343C;font-weight:500}
    [data-theme="dark"] .err{color:#F26D6D}
    .ok{text-align:center;padding:8px 0}
    .ok .big{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:26px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
    .toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:grid;gap:10px;max-width:min(360px,calc(100vw - 40px))}
    .toast{background:var(--text);color:var(--bg);border-radius:12px;padding:13px 16px;font-size:13.5px;font-weight:550;box-shadow:var(--shadow-md)}
    .rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
    .rv.in{opacity:1;transform:none}

    @media(max-width:900px){
      .links{display:none}.menu-btn{display:inline-flex}
      .m-panel{display:block;position:fixed;top:var(--nav-h);left:12px;right:12px;z-index:99;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:8px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s,transform .25s}
      .m-panel.open{opacity:1;transform:none;pointer-events:auto}
      .m-panel a{display:block;padding:13px 16px;border-radius:10px;text-decoration:none;font-weight:600}
      .m-panel a:hover{background:var(--surface-2)}
      .feat-grid,.plans,.quotes,.int-grid{grid-template-columns:1fr}
      .bene{grid-template-columns:1fr}
      .bene li:nth-child(even){padding-left:0;border-left:0}
      .mock-body{grid-template-columns:1fr}
      .mock-side{display:none}
      .float-cards{grid-template-columns:1fr}
      .f-grid{grid-template-columns:1fr 1fr}
      section{padding:60px 0}
    }
    @media (prefers-reduced-motion:no-preference){.toast{animation:tin .35s var(--ease)}@keyframes tin{from{opacity:0;transform:translateY(8px)}}}
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation:none!important;transition:none!important}
      .rv{opacity:1!important;transform:none!important}
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
  <a class="skip" href="#conteudo">Pular para o conteúdo</a>
  <div id="root"></div>
  <noscript><p style="padding:40px;font-family:sans-serif">Nexa é uma demonstração interativa e precisa de JavaScript.</p></noscript>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    function Reveal({children,delay=0,as:Tag="div"}){
      const ref=useRef(null);
      useEffect(()=>{
        const el=ref.current; if(!el) return;
        if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ el.classList.add("in"); return; }
        const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ el.classList.add("in"); io.disconnect(); } }),{threshold:.12});
        io.observe(el); return ()=>io.disconnect();
      },[]);
      return <Tag ref={ref} className="rv" style={{transitionDelay:delay+"ms"}}>{children}</Tag>;
    }
    function Magnetic({children}){
      const ref=useRef(null);
      useEffect(()=>{
        const el=ref.current; if(!el) return;
        if(!window.matchMedia("(pointer: fine)").matches) return;
        if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const mv=e=>{ const r=el.getBoundingClientRect(); el.style.transform=`translate(${(e.clientX-r.left-r.width/2)/r.width*6}px,${(e.clientY-r.top-r.height/2)/r.height*4}px)`; };
        const lv=()=>{ el.style.transform=""; };
        el.addEventListener("mousemove",mv); el.addEventListener("mouseleave",lv);
        return ()=>{ el.removeEventListener("mousemove",mv); el.removeEventListener("mouseleave",lv); };
      },[]);
      return <span ref={ref} style={{display:"inline-flex",transition:"transform .25s cubic-bezier(.16,1,.3,1)"}}>{children}</span>;
    }

    function SignupModal({plan,annual,onClose,onDone}){

      const firstRef=useRef(null);
      useEffect(()=>{ if(firstRef.current) firstRef.current.focus(); },[]);
      useEffect(()=>{ const k=e=>{ if(e.key==="Escape") onClose(); }; document.addEventListener("keydown",k); return ()=>document.removeEventListener("keydown",k); },[]);
      const submit=e=>{
        e.preventDefault();
        const errs={};
        if(name.trim().length<2) errs.name="Informe seu nome.";
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) errs.email="Digite um e-mail válido.";
        setErrors(errs);
        if(Object.keys(errs).length) return;
        setSent(true);
      };
      const price=annual?plan.a:plan.m;
      return (
        <div className="overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
          <div className="modal" role="dialog" aria-modal="true" aria-labelledby="su-t">
            <div className="modal-h"><h2 id="su-t">{sent?"Tudo pronto!":"Assinar "+plan.n}</h2>
              <button className="icon-btn" onClick={onClose} aria-label="Fechar"><Icon d={P.x}/></button></div>
            {sent ? (
              <div className="mbox"><div className="ok">
                <span className="big" aria-hidden="true">✓</span>
                <h3 style={{margin:"0 0 8px"}}>Cadastro simulado com sucesso</h3>
                <p style={{color:"var(--text-2)",fontSize:14,margin:"0 0 18px"}}>{name.split(" ")[0]}, você assinaria o plano {plan.n} ({price===0?"grátis":`R$ ${price}/mês`}). Nenhum dado foi enviado — é só demonstração.</p>
                <button className="btn btn-p" style={{width:"100%"}} onClick={()=>onDone(`Bem-vindo à Nexa (demonstração), ${name.split(" ")[0]}!`)}>Continuar explorando</button>
              </div></div>
            ) : (
              <form onSubmit={submit} noValidate>
                <p style={{margin:0,fontSize:13.5,color:"var(--text-2)"}}>Plano <b>{plan.n}</b> · {price===0?"grátis para sempre":`R$ ${price}/usuário por mês`} · simulação, sem cobrança.</p>
                <label className="field">Nome
                  <input ref={firstRef} value={name} onChange={e=>setName(e.target.value)} autoComplete="name" aria-invalid={!!errors.name} aria-describedby={errors.name?"su-n":undefined}/>
                  {errors.name && <span className="err" id="su-n">{errors.name}</span>}
                </label>
                <label className="field">E-mail profissional
                  <input type="email" value={email} onChange={e=>setEmail(e.target.value)} autoComplete="email" aria-invalid={!!errors.email} aria-describedby={errors.email?"su-e":undefined}/>
                  {errors.email && <span className="err" id="su-e">{errors.email}</span>}
                </label>
                <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
                  <button type="button" className="btn btn-g" onClick={onClose}>Cancelar</button>
                  <button type="submit" className="btn btn-p">Confirmar (demo)</button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
