<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finora — Dashboard financeiro (demonstração)</title>
  <meta name="description" content="Finora é um dashboard financeiro conceitual para estudo e portfólio: saldo, receitas, despesas, gráficos, transações com CRUD local e dark mode.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Finora — Dashboard financeiro (demonstração)">
  <meta property="og:description" content="Projeto demonstrativo de interface financeira: dados mockados, estado local, gráficos SVG acessíveis.">
  <script>try{var t=localStorage.getItem('finora.theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t}catch(e){}</script>
  <!-- ============================================================
    FINORA · dashboard financeiro conceitual (estudo/portfólio)
    Sem Node, sem build. Abrir index.html direto no navegador.
    CDN: React 18 + ReactDOM + Babel. Dados mockados + localStorage.
    Ordem: Configuração(tokens) → CSS → Dados → Componentes → App
    Acento único: verde #0A7B4D (light) / #3BD97F (dark)
  ============================================================ -->
  <style>
    :root{
      --bg:#F7F7F9; --surface:#FFFFFF; --surface-2:#F1F1F4;
      --text:#16161A; --text-2:#55555E; --text-3:#82828C;
      --line:rgba(0,0,0,.09); --line-soft:rgba(0,0,0,.055);
      --accent:#0A7B4D; --accent-ink:#FFFFFF; --accent-soft:rgba(10,123,77,.1);
      --danger:#C9343C; --danger-soft:rgba(201,52,60,.1);
      --amber:#B25E09; --amber-soft:rgba(178,94,9,.12);
      --nav-bg:rgba(247,247,249,.8);
      --shadow-sm:0 1px 2px rgba(16,16,26,.06);
      --shadow-md:0 10px 34px rgba(16,16,26,.1);
      --r:16px; --r-sm:10px; --pill:999px;
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;
      --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      --ease:cubic-bezier(.16,1,.3,1);
      --sbw:244px;
    }
    [data-theme="dark"]{
      --bg:#0C0E0D; --surface:#141716; --surface-2:#1C211F;
      --text:#F2F4F2; --text-2:#C2C8C4; --text-3:#8E968F;
      --line:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.06);
      --accent:#3BD97F; --accent-ink:#06281A; --accent-soft:rgba(59,217,127,.14);
      --danger:#F26D6D; --danger-soft:rgba(242,109,109,.14);
      --amber:#E8A33D; --amber-soft:rgba(232,163,61,.14);
      --nav-bg:rgba(12,14,13,.72);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 10px 34px rgba(0,0,0,.5);
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5}
    ::selection{background:var(--accent);color:#fff}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
    .skip{position:absolute;left:12px;top:-60px;z-index:300;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--pill);font-size:14px;font-weight:600;text-decoration:none}
    .skip:focus{top:12px}
    button{font:inherit;color:inherit}
    input,select{font:inherit;color:var(--text)}

    /* ---- shell ---- */
    .sb{position:fixed;inset:0 auto 0 0;width:var(--sbw);background:var(--surface);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;padding:22px 16px;z-index:60}
    .logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;letter-spacing:-.02em;padding:0 10px 20px;text-decoration:none}
    .logo-mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
    .logo small{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--text-3);border:1px solid var(--line);border-radius:var(--pill);padding:2px 8px;margin-left:2px}
    .sb nav{display:grid;gap:2px}
    .sb a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);text-decoration:none;font-size:14px;font-weight:550;color:var(--text-2)}
    .sb a:hover{background:var(--surface-2);color:var(--text)}
    .sb a.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
    .sb .foot{margin-top:auto;display:grid;gap:10px}
    .me{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--surface);width:100%;cursor:pointer;text-align:left}
    .me:hover{border-color:var(--accent)}
    .ava{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
    .me b{font-size:13.5px;display:block}.me span{font-size:12px;color:var(--text-3);display:block}
    .menu-pop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow-md);padding:6px;display:grid}
    .menu-pop button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;font-size:13.5px;cursor:pointer}
    .menu-pop button:hover{background:var(--surface-2)}
    .back{font-size:12.5px;color:var(--text-3);text-decoration:none;padding:0 10px}
    .back:hover{color:var(--accent)}
    .scrim{display:none}
    .main{margin-left:var(--sbw);min-height:100dvh}
    .top{position:sticky;top:0;z-index:50;background:var(--nav-bg);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line-soft)}
    .top-in{max-width:1080px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:12px}
    .burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;cursor:pointer;align-items:center;justify-content:center}
    .search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:9px 16px;max-width:380px}
    .search input{border:0;background:none;outline:none;width:100%;font-size:14px}
    .search input::placeholder{color:var(--text-3)}
    .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:3px;gap:2px}
    .seg button{border:0;background:none;border-radius:var(--pill);padding:7px 14px;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer}
    .seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
    .icon-btn{position:relative;border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
    .icon-btn:hover{border-color:var(--accent)}
    .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
    .pop-wrap{position:relative}
    .pop{position:absolute;right:0;top:calc(100% + 10px);width:300px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-md);padding:8px;z-index:70}
    .pop h3{font-size:13px;margin:6px 10px 8px;color:var(--text-3);font-weight:600}
    .notif{display:flex;gap:10px;padding:10px;border-radius:var(--r-sm);font-size:13.5px}
    .notif:hover{background:var(--surface-2)}
    .notif b{display:block;font-size:13.5px}.notif span{color:var(--text-3);font-size:12.5px}
    .ndot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
    .pop-act{display:block;width:100%;border:0;background:none;color:var(--accent);font-weight:650;font-size:13px;padding:10px;cursor:pointer;border-radius:8px}
    .pop-act:hover{background:var(--accent-soft)}
    .wrap{max-width:1080px;margin:0 auto;padding:28px}
    h1{font-size:clamp(1.5rem,2.6vw,2rem);letter-spacing:-.025em;margin:4px 0 2px}
    .sub{color:var(--text-2);font-size:14.5px;margin:0 0 22px}
    h2{font-size:1.02rem;letter-spacing:-.01em;margin:0}
    section.block{margin-bottom:26px;scroll-margin-top:90px}

    /* ---- kpis ---- */
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s}
    .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .kpi.hero{background:var(--text);color:var(--bg);border-color:transparent}
    .kpi.hero span{color:inherit;opacity:.65}
    .kpi span{font-size:12.5px;color:var(--text-3);font-weight:550;display:flex;align-items:center;gap:7px}
    .kpi b{font-size:1.45rem;letter-spacing:-.02em;display:block;margin-top:6px}
    .kpi small{font-size:12px;font-weight:600}
    .up{color:var(--accent)}.down{color:var(--danger)}
    [data-theme="dark"] .kpi.hero small.up{color:var(--accent)}

    /* ---- cards/charts ---- */
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
    .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0}
    .card-h p{font-size:13px;color:var(--text-3);margin:2px 0 0}
    .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
    .chart{padding:8px 12px 16px}
    .chart svg{width:100%;height:auto;display:block}
    .legend{display:flex;gap:16px;padding:0 20px 16px;font-size:12.5px;color:var(--text-2)}
    .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
    details.data{margin:0 20px 16px;font-size:13px}
    details.data summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
    details.data table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
    details.data th,details.data td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-soft)}
    .donut-wrap{display:flex;gap:8px;align-items:center;padding:6px 20px 18px}
    .donut-legend{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:13px;flex:1}
    .donut-legend li{display:flex;align-items:center;gap:9px}
    .donut-legend i{width:10px;height:10px;border-radius:3px;flex:none}
    .donut-legend b{margin-left:auto;font-variant-numeric:tabular-nums}
    .donut-legend small{color:var(--text-3);font-variant-numeric:tabular-nums}

    /* ---- transactions ---- */
    .tx-tools{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px 0}
    .tx-tools select{background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:9px 14px;font-size:13.5px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--pill);font-weight:650;font-size:14px;padding:11px 22px;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:transform .2s var(--ease),background .2s}
    .btn:active{transform:scale(.98)}
    .btn-p{background:var(--accent);color:var(--accent-ink)}
    .btn-p:hover{filter:brightness(1.07)}
    .btn-g{background:none;border-color:var(--line);color:var(--text)}
    .btn-g:hover{border-color:var(--accent)}
    .btn-d{background:var(--danger-soft);color:var(--danger)}
    .tx-list{list-style:none;margin:8px 0 0;padding:8px 12px 14px;display:grid;gap:6px}
    .tx{border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;background:var(--surface);transition:border-color .2s}
    .tx:hover{border-color:var(--line)}
    .tx-row{display:flex;align-items:center;gap:12px}
    .cdot{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;color:#fff}
    .tx-info{min-width:0;flex:1}
    .tx-info b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tx-info span{font-size:12.5px;color:var(--text-3)}
    .amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px;white-space:nowrap}
    .amt.in{color:var(--accent)}.amt.out{color:var(--text)}
    .tx-acts{display:flex;gap:4px}
    .mini-btn{border:1px solid transparent;background:none;border-radius:8px;padding:7px 9px;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer}
    .mini-btn:hover{background:var(--surface-2);color:var(--text)}
    .mini-btn.danger{color:var(--danger)}
    .tx-detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:12.5px}
    .tx-detail span{color:var(--text-3);display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
    .confirm{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--danger-soft);border-radius:10px;padding:9px 12px;font-size:13px}
    .empty{text-align:center;padding:44px 20px;color:var(--text-3)}
    .empty b{display:block;color:var(--text);margin:10px 0 4px;font-size:15px}
    .empty p{font-size:13.5px;margin:0 0 16px}

    /* ---- modal/toast ---- */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:120;display:flex;align-items:center;justify-content:center;padding:18px}
    .modal{background:var(--surface);border-radius:20px;width:100%;max-width:460px;box-shadow:var(--shadow-md);max-height:92dvh;overflow:auto}
    .modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0}
    .modal-h h2{font-size:1.1rem}
    .modal form{padding:16px 22px 22px;display:grid;gap:14px}
    .field{display:grid;gap:6px;font-size:13.5px;font-weight:600}
    .field input,.field select{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font-size:14px;width:100%}
    .field input[aria-invalid="true"]{border-color:var(--danger)}
    .err{font-size:12.5px;color:var(--danger);font-weight:500}
    .type-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .type-seg label{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px;text-align:center;font-size:14px;cursor:pointer}
    .type-seg input{position:absolute;opacity:0;width:1px;height:1px}
    .type-seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:700}
    .type-seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:grid;gap:10px;max-width:min(360px,calc(100vw - 40px))}
    .toast{background:var(--text);color:var(--bg);border-radius:12px;padding:13px 16px;font-size:13.5px;font-weight:550;box-shadow:var(--shadow-md);display:flex;gap:10px;align-items:center}
    .skel{border-radius:var(--r);background:linear-gradient(100deg,var(--surface-2) 40%,var(--surface) 50%,var(--surface-2) 60%);background-size:200% 100%;min-height:120px;border:1px solid var(--line-soft)}
    @media (prefers-reduced-motion:no-preference){.skel{animation:sh 1.4s infinite}.toast{animation:tin .35s var(--ease)}@keyframes sh{to{background-position:-200% 0}}@keyframes tin{from{opacity:0;transform:translateY(10px)}}}
    .foot-note{text-align:center;color:var(--text-3);font-size:12.5px;padding:8px 0 30px}

    @media(max-width:1020px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
    @media(max-width:860px){
      .sb{transform:translateX(-105%);transition:transform .3s var(--ease);width:min(300px,84vw)}
      .sb.open{transform:none;box-shadow:var(--shadow-md)}
      .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;border:0}
      .main{margin-left:0}
      .burger{display:inline-flex}
      .top-in{padding:12px 16px;flex-wrap:wrap}
      .search{max-width:none;order:3;flex-basis:100%}
      .wrap{padding:20px 16px}
      .tx-detail{grid-template-columns:repeat(2,1fr)}
      .row2{grid-template-columns:1fr}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
      html{scroll-behavior:auto}
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>

  <div id="root"></div>
  <noscript><p style="padding:40px;font-family:sans-serif">Finora precisa de JavaScript para funcionar (demonstração com dados locais).</p></noscript>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef } = React;

    /* ================= DADOS (mockados) ================= */
    const CATS = {
      "Salário":{color:"#0E9F6E",kind:"in"},"Freelance":{color:"#219653",kind:"in"},"Investimentos":{color:"#6BA368",kind:"in"},
      "Moradia":{color:"#E5484D",kind:"out"},"Alimentação":{color:"#E8912D",kind:"out"},"Transporte":{color:"#2F80ED",kind:"out"},
      "Saúde":{color:"#12A594",kind:"out"},"Lazer":{color:"#D64570",kind:"out"},"Educação":{color:"#0091FF",kind:"out"},
      "Assinaturas":{color:"#8E8E93",kind:"out"},"Compras":{color:"#B25E09",kind:"out"}
    };
    const METHODS = ["Pix","Cartão de crédito","Cartão de débito","Boleto","Transferência"];
    const SEED = [
      ["Salário mensal","Salário",5200,"2026-06-05","Transferência"],["Aluguel","Moradia",-1450,"2026-06-07","Boleto"],
      ["Supermercado semanal","Alimentação",-420,"2026-06-10","Cartão de débito"],["Freelance landing page","Freelance",900,"2026-06-14","Pix"],
      ["Combustível","Transporte",-250,"2026-06-16","Cartão de crédito"],["Academia","Saúde",-120,"2026-06-18","Cartão de crédito"],
      ["Cinema e jantar","Lazer",-180,"2026-06-21","Pix"],["Curso de React","Educação",-199,"2026-06-24","Cartão de crédito"],
      ["Netflix + Spotify","Assinaturas",-62,"2026-06-26","Cartão de crédito"],["Dividendos FIIs","Investimentos",145,"2026-06-28","Transferência"],
      ["Salário mensal","Salário",5200,"2026-07-05","Transferência"],["Aluguel","Moradia",-1450,"2026-07-07","Boleto"],
      ["Supermercado semanal","Alimentação",-465,"2026-07-11","Cartão de débito"],["iFood fim de semana","Alimentação",-132,"2026-07-13","Pix"],
      ["Manutenção carro","Transporte",-580,"2026-07-17","Cartão de crédito"],["Farmácia","Saúde",-96,"2026-07-20","Cartão de débito"],
      ["Show com amigos","Lazer",-240,"2026-07-25","Pix"],["Tênis de corrida","Compras",-349,"2026-07-28","Cartão de crédito"],
      ["Salário mensal","Salário",5200,"2026-08-05","Transferência"],["Aluguel","Moradia",-1450,"2026-08-07","Boleto"],
      ["Freelance dashboard","Freelance",1400,"2026-08-12","Pix"],["Supermercado semanal","Alimentação",-438,"2026-08-13","Cartão de débito"],
      ["Uber e metrô","Transporte",-210,"2026-08-19","Pix"],["Livros técnicos","Educação",-156,"2026-08-22","Cartão de crédito"],
      ["Viagem curta","Lazer",-890,"2026-08-27","Cartão de crédito"],["Salário mensal","Salário",5200,"2026-09-05","Transferência"],
      ["Aluguel","Moradia",-1480,"2026-09-07","Boleto"],["Supermercado semanal","Alimentação",-452,"2026-09-12","Cartão de débito"],
      ["Dentista","Saúde",-320,"2026-09-16","Pix"],["Freelance ajustes","Freelance",600,"2026-09-20","Pix"],
      ["Roupas","Compras",-410,"2026-09-24","Cartão de crédito"],["Salário mensal","Salário",5200,"2026-10-05","Transferência"],
      ["Aluguel","Moradia",-1480,"2026-10-07","Boleto"],["Supermercado semanal","Alimentação",-389,"2026-10-10","Cartão de débito"]
    ].map((t,i)=>({id:"seed-"+i,desc:t[0],cat:t[1],amount:t[2],date:t[3],method:t[4]}));
    const NOTIFS = [
      {t:"Fatura do cartão fecha amanhã",s:"Revise os lançamentos antes do fechamento.",unread:true},
      {t:"Meta de economia em 72%",s:"Faltam R$ 410 para a meta do mês.",unread:true},
      {t:"Assinatura renovada",s:"Streaming cobrado no cartão final 4321.",unread:false}
    ];

    /* ================= UTILS ================= */
    const fmt = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
    const uid = () => "tx-" + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);
    const monthKey = d => d.slice(0,7);
    const monthLabel = k => new Date(k+"-02T12:00:00").toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
    const fullDate = d => new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});
    const shortDate = d => new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
    const PERIODS = [{id:"3M",label:"3M"},{id:"6M",label:"6M"},{id:"ANO",label:"2026"}];
    function rangeMonths(period){
      const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
      const n = period==="3M"?3:period==="6M"?6:m+1;
      const out=[]; for(let i=n-1;i>=0;i--){const d=new Date(y,m-i,1);out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));}
      return out;
    }
    const Icon = ({d,s=18}) => (<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d={d}/></svg>);
    const P = {
      menu:"M4 6h16M4 12h16M4 18h16", search:"M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM21 21l-4.3-4.3",
      sun:"M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10ZM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",
      moon:"M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z", bell:"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0",
      plus:"M12 5v14M5 12h14", x:"M18 6 6 18M6 6l12 12", pencil:"M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z",
      trash:"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6",
      eye:"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7ZM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z",
      wallet:"M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16V7M18 12a1 1 0 0 0 0 2h.01",
      up:"M7 17 17 7M7 7h10v10", down:"M17 7 7 17M17 17H7V7",
      piggy:"M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.5-1 1-3 1.5-1.5 4-3 4ZM12 10a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z",
      grid:"M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z",
      chart:"M3 3v18h18M8 17V9m5 8V5m5 12v-6", card:"M2 8.5h20M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2Z",
      cog:"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1Z",
      check:"M20 6 9 17l-5-5", alert:"M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z",
      back:"M19 12H5m7-7-7 7 7 7"
    };

    /* ================= APP ================= */
    function App(){
      const [theme,setTheme] = useState(document.documentElement.dataset.theme||"light");
      const [txs,setTxs] = useState(()=>{ try{const s=localStorage.getItem("finora.txs.v1"); if(s) return JSON.parse(s);}catch(e){} return SEED; });
      const [period,setPeriod] = useState("6M");
      const [query,setQuery] = useState("");
      const [catFilter,setCatFilter] = useState("todas");
      const [modal,setModal] = useState(null); // {mode:'new'|'edit', tx?}
      const [openDetail,setOpenDetail] = useState(null);
      const [confirmDel,setConfirmDel] = useState(null);
      const [toasts,setToasts] = useState([]);
      const [notifs,setNotifs] = useState(NOTIFS);
      const [pop,setPop] = useState(null); // 'notif' | 'me' | null
      const [sbOpen,setSbOpen] = useState(false);
      const [loading,setLoading] = useState(true);
      const [activeNav,setActiveNav] = useState("visao");
      const openerRef = useRef(null);

      useEffect(()=>{ document.documentElement.dataset.theme=theme; try{localStorage.setItem("finora.theme",theme)}catch(e){} },[theme]);
      useEffect(()=>{ try{localStorage.setItem("finora.txs.v1",JSON.stringify(txs))}catch(e){} },[txs]);
      useEffect(()=>{ const t=setTimeout(()=>setLoading(false),650); return ()=>clearTimeout(t); },[]);
      useEffect(()=>{
        const onKey=e=>{ if(e.key==="Escape"){ setModal(null); setPop(null); setSbOpen(false);} };
        document.addEventListener("keydown",onKey); return ()=>document.removeEventListener("keydown",onKey);
      },[]);

      const toast = msg => { const id=uid(); setToasts(t=>[...t,{id,msg}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3200); };
      const months = useMemo(()=>rangeMonths(period),[period]);
      const inRange = txs.filter(t=>months.includes(monthKey(t.date)));
      const filtered = inRange.filter(t=>{
        const q=query.trim().toLowerCase();
        return (catFilter==="todas"||t.cat===catFilter) && (!q||t.desc.toLowerCase().includes(q));
      }).sort((a,b)=>b.date.localeCompare(a.date));
      const tot = useMemo(()=>{
        let r=0,d=0; inRange.forEach(t=>{ if(t.amount>0)r+=t.amount; else d+=-t.amount; });
        return {r,d,net:r-d,balance:txs.reduce((s,t)=>s+t.amount,0)};
      },[inRange,txs]);
      const series = months.map(m=>{
        let r=0,d=0; txs.forEach(t=>{ if(monthKey(t.date)===m){ if(t.amount>0)r+=t.amount; else d+=-t.amount; } });
        return {m,r,d,net:r-d};
      });
      const donut = useMemo(()=>{
        const map={}; inRange.forEach(t=>{ if(t.amount<0) map[t.cat]=(map[t.cat]||0)+-t.amount; });
        const arr=Object.entries(map).map(([cat,v])=>({cat,v})).sort((a,b)=>b.v-a.v);
        const total=arr.reduce((s,x)=>s+x.v,0)||1;
        return {arr,total};
      },[inRange]);

      const openModal=(mode,tx,opener)=>{ openerRef.current=opener||document.activeElement; setModal({mode,tx:tx||null}); };
      const closeModal=()=>{ setModal(null); if(openerRef.current&&openerRef.current.focus) openerRef.current.focus(); };
      const saveTx=draft=>{
        if(modal.mode==="new"){ setTxs(t=>[{...draft,id:uid()},...t]); toast("Transação adicionada."); }
        else { setTxs(t=>t.map(x=>x.id===modal.tx.id?{...draft,id:x.id}:x)); toast("Transação atualizada."); }
        closeModal();
      };
      const removeTx=id=>{ setTxs(t=>t.filter(x=>x.id!==id)); setConfirmDel(null); setOpenDetail(null); toast("Transação removida."); };
      const resetDemo=()=>{ setTxs(SEED); setPop(null); toast("Dados de demonstração restaurados."); };
      const unread=notifs.filter(n=>n.unread).length;

      return (
        <React.Fragment>
          <aside className={"sb"+(sbOpen?" open":"")} aria-label="Menu lateral">
            <a className="logo" href="#visao" onClick={()=>setSbOpen(false)}><span className="logo-mark">F</span>Finora <small>demo</small></a>
            <nav aria-label="Seções">
              {[["visao","Visão geral",P.grid],["evolucao","Evolução",P.chart],["categorias","Categorias",P.wallet],["transacoes","Transações",P.card]].map(([id,label,ic])=>(
                <a key={id} href={"#"+id} className={activeNav===id?"active":""} onClick={()=>{setActiveNav(id);setSbOpen(false);}}><Icon d={ic}/>{label}</a>
              ))}
            </nav>
            <div className="foot">
              <div className="pop-wrap">
                {pop==="me" && (
                  <div className="menu-pop" role="menu" aria-label="Conta">
                    <button role="menuitem" onClick={resetDemo}>Restaurar dados de demonstração</button>
                    <button role="menuitem" onClick={()=>{setTheme(t=>t==="light"?"dark":"light")}}>Alternar para modo {theme==="light"?"escuro":"claro"}</button>
                  </div>
                )}
                <button className="me" onClick={()=>setPop(p=>p==="me"?null:"me")} aria-expanded={pop==="me"} aria-haspopup="menu">
                  <span className="ava" aria-hidden="true">WM</span>
                  <span><b>Wesley Melo</b><span>Conta demonstrativa</span></span>
                </button>
              </div>
              <a className="back" href="../index.html">← Voltar ao portfólio</a>
            </div>
          </aside>
          {sbOpen && <button className="scrim" onClick={()=>setSbOpen(false)} aria-label="Fechar menu"/>}

          <div className="main">
            <header className="top">
              <div className="top-in">
                <button className="burger" onClick={()=>setSbOpen(true)} aria-label="Abrir menu"><Icon d={P.menu}/></button>
                <label className="search"><Icon d={P.search}/><input type="search" placeholder="Pesquisar transações…" value={query} onChange={e=>setQuery(e.target.value)} aria-label="Pesquisar transações"/></label>
                <div className="seg" role="group" aria-label="Período">
                  {PERIODS.map(p=>(<button key={p.id} aria-pressed={period===p.id} onClick={()=>setPeriod(p.id)}>{p.label}</button>))}
                </div>
                <button className="icon-btn" onClick={()=>setTheme(t=>t==="light"?"dark":"light")} aria-label={theme==="light"?"Ativar modo escuro":"Ativar modo claro"}><Icon d={theme==="light"?P.moon:P.sun}/></button>
                <div className="pop-wrap">
                  <button className="icon-btn" onClick={()=>setPop(p=>p==="notif"?null:"notif")} aria-expanded={pop==="notif"} aria-label={"Notificações"+(unread?`, ${unread} não lidas`:"")}><Icon d={P.bell}/>{unread>0 && <span className="badge">{unread}</span>}</button>
                  {pop==="notif" && (
                    <div className="pop" role="dialog" aria-label="Notificações">
                      <h3>Notificações</h3>
                      {notifs.map((n,i)=>(
                        <div className="notif" key={i}>{n.unread && <span className="ndot" aria-hidden="true"/>}<div><b>{n.t}</b><span>{n.s}</span></div></div>
                      ))}
                      {unread>0 && <button className="pop-act" onClick={()=>{setNotifs(n=>n.map(x=>({...x,unread:false})));toast("Notificações marcadas como lidas.");}}>Marcar todas como lidas</button>}
                    </div>
                  )}
                </div>
              </div>
            </header>

            <main className="wrap" id="conteudo">
              <p className="sub" style={{marginBottom:0}}>Terça-feira, 6 de outubro de 2026 · dados fictícios para demonstração</p>
              <h1 id="visao">Visão geral</h1>
              <p className="sub">Acompanhe saldo, receitas e despesas do período selecionado.</p>

              {loading ? (
                <div className="kpis" aria-hidden="true"><div className="skel"/><div className="skel"/><div className="skel"/><div className="skel"/></div>
              ) : (
              <section className="block" aria-label="Indicadores">
                <div className="kpis">
                  <div className="kpi hero"><span>Saldo total</span><b>{fmt.format(tot.balance)}</b><small className="up">todas as contas</small></div>
                  <div className="kpi"><span><Icon d={P.up} s={14}/> Receitas</span><b>{fmt.format(tot.r)}</b><small className="up">no período</small></div>
                  <div className="kpi"><span><Icon d={P.down} s={14}/> Despesas</span><b>{fmt.format(tot.d)}</b><small className="down">no período</small></div>
                  <div className="kpi"><span><Icon d={P.piggy} s={14}/> Economia</span><b>{fmt.format(tot.net)}</b><small className={tot.net>=0?"up":"down"}>{tot.r?Math.round(tot.net/tot.r*100):0}% da receita</small></div>
                </div>
              </section>
              )}

              <div className="grid2">
                <section className="block card" id="evolucao" aria-labelledby="ev-t">
                  <div className="card-h"><div><h2 id="ev-t">Evolução financeira</h2><p>Receitas e despesas por mês, em reais.</p></div></div>
                  {loading ? <div style={{padding:20}}><div className="skel"/></div> : <AreaChart series={series}/>}
                </section>
                <section className="block card" id="categorias" aria-labelledby="cat-t">
                  <div className="card-h"><div><h2 id="cat-t">Despesas por categoria</h2><p>Distribuição no período selecionado.</p></div></div>
                  {loading ? <div style={{padding:20}}><div className="skel"/></div> : <Donut data={donut}/>}
                </section>
              </div>

              <section className="block card" id="transacoes" aria-labelledby="tx-t">
                <div className="card-h">
                  <div><h2 id="tx-t">Transações</h2><p>{filtered.length} {filtered.length===1?"lançamento":"lançamentos"} no período.</p></div>
                  <button className="btn btn-p" onClick={e=>openModal("new",null,e.currentTarget)}><Icon d={P.plus} s={16}/> Nova transação</button>
                </div>
                <div className="tx-tools">
                  <select value={catFilter} onChange={e=>setCatFilter(e.target.value)} aria-label="Filtrar por categoria">
                    <option value="todas">Todas as categorias</option>
                    {Object.keys(CATS).map(c=>(<option key={c} value={c}>{c}</option>))}
                  </select>
                  {(query||catFilter!=="todas") && <button className="btn btn-g" onClick={()=>{setQuery("");setCatFilter("todas")}}>Limpar filtros</button>}
                </div>
                {filtered.length===0 ? (
                  <div className="empty">
                    <Icon d={P.search} s={30}/>
                    <b>Nenhum lançamento encontrado</b>
                    <p>Ajuste a pesquisa, o período ou adicione uma nova transação.</p>
                    <button className="btn btn-p" onClick={e=>openModal("new",null,e.currentTarget)}><Icon d={P.plus} s={16}/> Adicionar transação</button>
                  </div>
                ) : (
                  <ul className="tx-list">
                    {filtered.map(t=>(
                      <TxRow key={t.id} t={t} open={openDetail===t.id}
                        onToggle={()=>setOpenDetail(o=>o===t.id?null:t.id)}
                        onEdit={e=>openModal("edit",t,e.currentTarget)}
                        confirming={confirmDel===t.id}
                        onAskDel={()=>setConfirmDel(t.id)} onCancelDel={()=>setConfirmDel(null)}
                        onDel={()=>removeTx(t.id)} />
                    ))}
                  </ul>
                )}
              </section>
              <p className="foot-note">Finora é um projeto conceitual para estudo e portfólio. Valores e dados são fictícios e ficam salvos apenas neste navegador.</p>
            </main>
          </div>

          {modal && <TxModal mode={modal.mode} tx={modal.tx} onClose={closeModal} onSave={saveTx}/>}
          <div className="toasts" aria-live="polite">
            {toasts.map(t=>(<div className="toast" key={t.id} role="status"><Icon d={P.check} s={16}/> {t.msg}</div>))}
          </div>
        </React.Fragment>
      );
    }

    /* ============ GRÁFICO DE ÁREA (SVG real) ============ */
    function AreaChart({series}){
      const W=680,H=240,PL=8,PR=8,PT=14,PB=30;
      const max=Math.max(...series.map(s=>Math.max(s.r,s.d)),1);
      const X=i=>PL+(W-PL-PR)*(series.length===1?0.5:i/(series.length-1));
      const Y=v=>PT+(H-PT-PB)*(1-v/max);
      const line=k=>series.map((s,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(s[k]).toFixed(1)).join(" ");
      const area="M"+X(0).toFixed(1)+","+Y(0).toFixed(1)+" "+series.map((s,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(s.net).toFixed(1)).join(" ")+` L${X(series.length-1).toFixed(1)},${Y(0).toFixed(1)} Z`;
      const gid="ag"+Math.floor(Math.random()*1e6);
      return (
        <div className="chart">
          <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label={"Evolução mensal. " + series.map(s=>`${monthLabel(s.m)}: receitas ${fmt.format(s.r)}, despesas ${fmt.format(s.d)}`).join(". ")}>
            <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stopColor="var(--accent)" stopOpacity=".28"/><stop offset="1" stopColor="var(--accent)" stopOpacity="0"/>
            </linearGradient></defs>
            {[0.25,0.5,0.75,1].map(f=>(<line key={f} x1={PL} x2={W-PR} y1={PT+(H-PT-PB)*(1-f)} y2={PT+(H-PT-PB)*(1-f)} stroke="var(--line-soft)" strokeWidth="1"/>))}
            <path d={area} fill={`url(#${gid})`}/>
            <path d={line("r")} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinecap="round"/>
            <path d={line("d")} fill="none" stroke="var(--danger)" strokeWidth="2" strokeDasharray="5 4" strokeLinecap="round"/>
            {series.map((s,i)=>(
              <g key={s.m}>
                <circle cx={X(i)} cy={Y(s.r)} r="4" fill="var(--surface)" stroke="var(--accent)" strokeWidth="2.5" tabindex="0" aria-label={`${monthLabel(s.m)}: receitas ${fmt.format(s.r)}`}>
                  <title>{`${monthLabel(s.m)} · receitas ${fmt.format(s.r)}`}</title>
                </circle>
                <text x={X(i)} y={H-10} textAnchor="middle" fontSize="12" fill="var(--text-3)" style={{textTransform:"capitalize"}}>{monthLabel(s.m)}</text>
              </g>
            ))}
          </svg>
          <div className="legend"><span><i style={{background:"var(--accent)"}}/>Receitas</span><span><i style={{background:"var(--danger)"}}/>Despesas</span></div>
          <details className="data"><summary>Ver dados em tabela</summary>
            <table><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Saldo</th></tr></thead>
            <tbody>{series.map(s=>(<tr key={s.m}><td style={{textTransform:"capitalize"}}>{monthLabel(s.m)}</td><td>{fmt.format(s.r)}</td><td>{fmt.format(s.d)}</td><td>{fmt.format(s.net)}</td></tr>))}</tbody></table>
          </details>
        </div>
      );
    }

    /* ============ DONUT (SVG real) ============ */
    function Donut({data}){
      const R=64,C=2*Math.PI*R; let acc=0;
      if(!data.arr.length) return <div className="empty"><b>Sem despesas no período</b><p>Adicione lançamentos para ver a distribuição.</p></div>;
      return (
        <div className="donut-wrap">
          <svg width="168" height="168" viewBox="0 0 168 168" role="img" aria-label={"Despesas por categoria. Total "+fmt.format(data.total)+". "+data.arr.map(a=>`${a.cat}: ${fmt.format(a.v)}`).join(", ")}>
            <circle cx="84" cy="84" r={R} fill="none" stroke="var(--surface-2)" strokeWidth="20"/>
            {data.arr.map(a=>{
              const frac=a.v/data.total, el=acc; acc+=frac;
              return <circle key={a.cat} cx="84" cy="84" r={R} fill="none" stroke={CATS[a.cat]?CATS[a.cat].color:"#888"}
                strokeWidth="20" strokeDasharray={`${(frac*C-2).toFixed(1)} ${C.toFixed(1)}`}
                strokeDashoffset={(-el*C+C*0.25).toFixed(1)} strokeLinecap="butt"><title>{a.cat}: {fmt.format(a.v)}</title></circle>;
            })}
            <text x="84" y="80" textAnchor="middle" fontSize="13" fill="var(--text-3)">total</text>
            <text x="84" y="102" textAnchor="middle" fontSize="17" fontWeight="700" fill="var(--text)">{fmt.format(data.total).replace(",00","")}</text>
          </svg>
          <ul className="donut-legend">
            {data.arr.slice(0,6).map(a=>(
              <li key={a.cat}><i style={{background:CATS[a.cat]?CATS[a.cat].color:"#888"}}/>{a.cat}<b>{Math.round(a.v/data.total*100)}%</b></li>
            ))}
          </ul>
        </div>
      );
    }

    /* ============ LINHA DE TRANSAÇÃO ============ */
    function TxRow({t,open,onToggle,onEdit,confirming,onAskDel,onCancelDel,onDel}){
      const c=CATS[t.cat]||{color:"#888"};
      return (
        <li className="tx">
          <div className="tx-row">
            <span className="cdot" style={{background:c.color}} aria-hidden="true">{t.desc.charAt(0).toUpperCase()}</span>
            <div className="tx-info"><b>{t.desc}</b><span>{t.cat} · {shortDate(t.date)}</span></div>
            <span className={"amt "+(t.amount>0?"in":"out")}>{(t.amount>0?"+":"−")+fmt.format(Math.abs(t.amount))}</span>
            <div className="tx-acts">
              <button className="mini-btn" onClick={onToggle} aria-expanded={open} aria-label={(open?"Ocultar":"Ver")+" detalhes de "+t.desc}><Icon d={P.eye} s={15}/></button>
              <button className="mini-btn" onClick={onEdit} aria-label={"Editar "+t.desc}><Icon d={P.pencil} s={15}/></button>
              <button className="mini-btn danger" onClick={onAskDel} aria-label={"Remover "+t.desc}><Icon d={P.trash} s={15}/></button>
            </div>
          </div>
          {open && (
            <div className="tx-detail">
              <div><span>Descrição</span>{t.desc}</div>
              <div><span>Categoria</span>{t.cat}</div>
              <div><span>Data</span>{fullDate(t.date)}</div>
              <div><span>Pagamento</span>{t.method}</div>
            </div>
          )}
          {confirming && (
            <div className="confirm" role="alert">
              <Icon d={P.alert} s={16}/> Remover “{t.desc}”?
              <button className="btn btn-d" style={{padding:"7px 16px",fontSize:13}} onClick={onDel}>Remover</button>
              <button className="btn btn-g" style={{padding:"7px 16px",fontSize:13}} onClick={onCancelDel}>Manter</button>
            </div>
          )}
        </li>
      );
    }

    /* ============ MODAL DE TRANSAÇÃO ============ */
    function TxModal({mode,tx,onClose,onSave}){
      const isNew=mode==="new";
      const [tipo,setTipo]=useState(tx?(tx.amount>0?"in":"out"):"out");
      const [desc,setDesc]=useState(tx?tx.desc:"");
      const [valor,setValor]=useState(tx?Math.abs(tx.amount).toFixed(2).replace(".",","):"");
      const [cat,setCat]=useState(tx?tx.cat:"");
      const [date,setDate]=useState(tx?tx.date:new Date().toISOString().slice(0,10));
      const [method,setMethod]=useState(tx?tx.method:METHODS[0]);
      const [errors,setErrors]=useState({});
      const firstRef=useRef(null);
      useEffect(()=>{ if(firstRef.current) firstRef.current.focus(); },[]);
      useEffect(()=>{
        const onKey=e=>{ if(e.key==="Escape") onClose(); };
        document.addEventListener("keydown",onKey); return ()=>document.removeEventListener("keydown",onKey);
      },[]);
      const catOpts=Object.keys(CATS).filter(c=>CATS[c].kind===(tipo==="in"?"in":"out"));
      useEffect(()=>{ if(!catOpts.includes(cat)) setCat(""); },[tipo]);
      const submit=e=>{
        e.preventDefault();
        const errs={};
        if(!desc.trim()) errs.desc="Informe uma descrição.";
        const num=parseFloat(String(valor).replace(/\./g,"").replace(",","."));
        if(!(num>0)) errs.valor="Informe um valor maior que zero.";
        if(!date) errs.date="Escolha a data.";
        if(!cat) errs.cat="Escolha a categoria.";
        setErrors(errs);
        if(Object.keys(errs).length) return;
        onSave({desc:desc.trim(),cat,amount:tipo==="in"?num:-num,date,method});
      };
      return (
        <div className="overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
          <div className="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
            <div className="modal-h"><h2 id="m-title">{isNew?"Nova transação":"Editar transação"}</h2>
              <button className="icon-btn" onClick={onClose} aria-label="Fechar"><Icon d={P.x}/></button></div>
            <form onSubmit={submit} noValidate>
              <div className="type-seg" role="radiogroup" aria-label="Tipo">
                <label><input ref={firstRef} type="radio" name="tipo" checked={tipo==="out"} onChange={()=>setTipo("out")}/> Despesa</label>
                <label><input type="radio" name="tipo" checked={tipo==="in"} onChange={()=>setTipo("in")}/> Receita</label>
              </div>
              <label className="field">Descrição
                <input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Ex.: Supermercado" aria-invalid={!!errors.desc} aria-describedby={errors.desc?"e-desc":undefined}/>
                {errors.desc && <span className="err" id="e-desc">{errors.desc}</span>}
              </label>
              <div className="row2">
                <label className="field">Valor (R$)
                  <input inputMode="decimal" value={valor} onChange={e=>setValor(e.target.value)} placeholder="0,00" aria-invalid={!!errors.valor} aria-describedby={errors.valor?"e-valor":undefined}/>
                  {errors.valor && <span className="err" id="e-valor">{errors.valor}</span>}
                </label>
                <label className="field">Data
                  <input type="date" value={date} onChange={e=>setDate(e.target.value)} aria-invalid={!!errors.date} aria-describedby={errors.date?"e-date":undefined}/>
                  {errors.date && <span className="err" id="e-date">{errors.date}</span>}
                </label>
              </div>
              <div className="row2">
                <label className="field">Categoria
                  <select value={cat} onChange={e=>setCat(e.target.value)} aria-invalid={!!errors.cat} aria-describedby={errors.cat?"e-cat":undefined}>
                    <option value="">Selecionar…</option>
                    {catOpts.map(c=>(<option key={c} value={c}>{c}</option>))}
                  </select>
                  {errors.cat && <span className="err" id="e-cat">{errors.cat}</span>}
                </label>
                <label className="field">Pagamento
                  <select value={method} onChange={e=>setMethod(e.target.value)}>{METHODS.map(m=>(<option key={m}>{m}</option>))}</select>
                </label>
              </div>
              <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
                <button type="button" className="btn btn-g" onClick={onClose}>Cancelar</button>
                <button type="submit" className="btn btn-p">{isNew?"Adicionar":"Salvar alterações"}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
