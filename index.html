<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wesley Melo — Tecnologia & Desenvolvimento</title>
  <meta name="description" content="Portfólio de Wesley Melo: tecnologia, desenvolvimento web, automação e projetos digitais. Aberto a estágio e vagas júnior.">
  <meta name="author" content="Wesley Melo">
  <meta name="theme-color" content="#05060f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Wesley Melo — Tecnologia & Desenvolvimento">
  <meta property="og:description" content="Explorando ideias, desenvolvendo soluções e transformando criatividade em projetos digitais.">
  <script>try{var t=localStorage.getItem("wsm.theme");if(!t){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <!-- ============================================================
    PORTFÓLIO · Wesley Melo · edição galáxia
    Um único index.html. Sem Node, sem build, sem npm.
    Abrir direto no navegador (CDNs: React 18 + ReactDOM + Babel).
    Ordem: Tokens → Base → Fundo espacial → Componentes → App
    Acento único: violeta espacial (#5b3df0 light / #8f7bff dark)
  ============================================================ -->
  <style>
    /* ============ TOKENS ============ */
    :root{
      --bg:#f5f6fa; --bg-2:#e9ebf4;
      --surface:rgba(255,255,255,.72); --surface-solid:#ffffff; --surface-2:#eceef5;
      --text:#14141c; --text-2:#54555f; --text-3:#8a8a96;
      --line:rgba(20,20,50,.12); --line-soft:rgba(20,20,50,.07);
      --accent:#5b3df0; --accent-h:#6f4dff; --accent-ink:#ffffff;
      --accent-soft:rgba(91,61,240,.1);
      --nav-bg:rgba(245,246,250,.75);
      --star-alpha:.5;
      --nebula-a:rgba(91,61,240,.10); --nebula-b:rgba(64,120,255,.10);
      --shadow-sm:0 1px 2px rgba(20,20,50,.06);
      --shadow-md:0 10px 34px rgba(40,40,90,.10);
      --shadow-lg:0 26px 70px rgba(40,40,90,.14);
      --r:18px; --r-sm:12px; --pill:999px;
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;
      --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
      --ease:cubic-bezier(.16,1,.3,1);
      --max:1060px; --nav-h:62px;
    }
    [data-theme="dark"]{
      --bg:#05060f; --bg-2:#0a0d1f;
      --surface:rgba(255,255,255,.045); --surface-solid:#0d1024; --surface-2:#11142b;
      --text:#f2f3fa; --text-2:#b9bdd0; --text-3:#7c81a0;
      --line:rgba(255,255,255,.11); --line-soft:rgba(255,255,255,.06);
      --accent:#8f7bff; --accent-h:#a48fff; --accent-ink:#0b0618;
      --accent-soft:rgba(143,123,255,.13);
      --nav-bg:rgba(5,6,15,.7);
      --star-alpha:1;
      --nebula-a:rgba(110,80,255,.14); --nebula-b:rgba(50,110,255,.12);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 10px 34px rgba(0,0,0,.5);
      --shadow-lg:0 26px 70px rgba(0,0,0,.55);
    }

    /* ============ BASE ============ */
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 14px)}
    body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.55;
      transition:background-color .45s ease,color .45s ease;overflow-x:clip}
    ::selection{background:var(--accent);color:#fff}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
    .skip{position:absolute;left:14px;top:-60px;z-index:400;background:var(--text);color:var(--bg);
      padding:10px 18px;border-radius:var(--pill);font-size:14px;font-weight:600;text-decoration:none}
    .skip:focus{top:12px}
    h1,h2,h3{letter-spacing:-.03em;line-height:1.08;margin:0;text-wrap:balance}
    p{margin:0}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
    section{padding:92px 0;position:relative}
    @media(max-width:768px){section{padding:64px 0}}

    /* ============ FUNDO ESPACIAL ============ */
    .stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--star-alpha)}
    .nebula{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;transition:opacity .45s ease}
    .neb-a{width:560px;height:560px;left:-160px;top:-140px;background:radial-gradient(closest-side,var(--nebula-a),transparent)}
    .neb-b{width:620px;height:620px;right:-200px;top:32%;background:radial-gradient(closest-side,var(--nebula-b),transparent)}
    .neb-c{width:520px;height:520px;left:-180px;bottom:-160px;background:radial-gradient(closest-side,var(--nebula-a),transparent);opacity:.7}
    .site{position:relative;z-index:1}
    .site.locked{height:100dvh;overflow:hidden}
    @media (prefers-reduced-motion:no-preference){
      .neb-a{animation:drift 26s ease-in-out infinite alternate}
      .neb-b{animation:drift 32s ease-in-out infinite alternate-reverse}
      @keyframes drift{from{transform:translate(0,0)}to{transform:translate(46px,30px)}}
    }

    /* ============ NAV ============ */
    .nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:100;
      border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
    .nav.scrolled{background:var(--nav-bg);-webkit-backdrop-filter:saturate(160%) blur(18px);
      backdrop-filter:saturate(160%) blur(18px);border-bottom-color:var(--line-soft);
      box-shadow:0 6px 24px rgba(0,0,0,.06)}
    .nav-in{max-width:var(--max);margin:0 auto;padding:0 24px;height:var(--nav-h);
      display:flex;align-items:center;gap:6px}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:750;
      font-size:15.5px;letter-spacing:-.01em;margin-right:10px}
    .brand-mark{width:30px;height:30px;border-radius:50%;flex:none;
      border:1px solid var(--line);background:var(--surface-2);
      display:inline-flex;align-items:center;justify-content:center;
      font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--accent)}
    .links{display:flex;gap:2px;list-style:none;margin:0;padding:0}
    .links a{text-decoration:none;font-size:14px;font-weight:500;color:var(--text-2);
      padding:8px 14px;border-radius:var(--pill);transition:background .2s,color .2s}
    .links a:hover{background:var(--accent-soft);color:var(--text)}
    .nav-act{margin-left:auto;display:flex;align-items:center;gap:8px}
    .icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);
      width:38px;height:38px;border-radius:50%;cursor:pointer;flex:none;
      display:inline-flex;align-items:center;justify-content:center;
      transition:transform .2s var(--ease),border-color .2s}
    .icon-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
    .icon-btn:active{transform:scale(.96)}
    .menu-btn{display:none}
    .m-panel{display:none}
    @media(max-width:760px){
      .links{display:none}
      .menu-btn{display:inline-flex}
      .m-panel{display:block;position:fixed;top:var(--nav-h);left:12px;right:12px;z-index:99;
        background:var(--surface-solid);border:1px solid var(--line);border-radius:var(--r);
        box-shadow:var(--shadow-lg);padding:8px;opacity:0;transform:translateY(-8px);
        pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease)}
      .m-panel.open{opacity:1;transform:none;pointer-events:auto}
      .m-panel a{display:flex;justify-content:space-between;padding:14px 16px;border-radius:var(--r-sm);
        text-decoration:none;font-size:16px;font-weight:600}
      .m-panel a:hover{background:var(--surface-2)}
      .m-panel a span:last-child{color:var(--text-3);font-weight:400}
    }

    /* ============ BOTÕES ============ */
    .btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
      min-height:48px;padding:0 30px;border-radius:var(--pill);font-size:15px;font-weight:650;
      text-decoration:none;cursor:pointer;border:1px solid transparent;white-space:nowrap;
      transition:transform .25s var(--ease),box-shadow .25s,background .2s,border-color .2s}
    .btn:active{transform:scale(.98)}
    .btn-p{background:linear-gradient(180deg,var(--accent-h),var(--accent));color:var(--accent-ink);
      box-shadow:0 8px 26px rgba(110,85,255,.3)}
    .btn-p:hover{box-shadow:0 12px 34px rgba(110,85,255,.38)}
    .btn-g{background:var(--surface);color:var(--text);border-color:var(--line);
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
    .btn-g:hover{border-color:var(--accent)}
    .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:30px}

    /* ============ HERO ============ */
    .hero{min-height:100dvh;display:flex;align-items:center;padding:calc(var(--nav-h) + 40px) 0 60px;
      text-align:center;overflow:clip}
    .hero-inner{position:relative}
    .orbit{position:absolute;left:50%;top:44%;width:min(560px,92vw);aspect-ratio:1;
      transform:translate(-50%,-50%);pointer-events:none;opacity:.5}
    .orbit svg{width:100%;height:100%}
    .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--text-3);
      text-transform:uppercase}
    .hero h1{font-size:clamp(3rem,8vw,5.2rem);font-weight:800;margin-top:18px}
    .hero h1 .grad{background:linear-gradient(100deg,var(--text) 30%,var(--accent) 55%,var(--text) 80%);
      background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
    .tagline{color:var(--text-2);font-size:clamp(1.02rem,1.8vw,1.22rem);line-height:1.65;
      max-width:44ch;margin:20px auto 0}
    .status{display:inline-flex;align-items:center;gap:9px;margin-top:26px;
      border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);
      padding:7px 16px 7px 11px;font-size:13px;color:var(--text-2);
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
    .dot{width:8px;height:8px;border-radius:50%;background:#34d17b;
      box-shadow:0 0 0 4px rgba(52,209,123,.16);flex:none}
    .scroll-cue{margin-top:56px;color:var(--text-3);font-size:12.5px;letter-spacing:.14em;
      text-transform:uppercase;font-family:var(--mono);display:flex;flex-direction:column;
      align-items:center;gap:10px}
    .scroll-cue i{width:1px;height:44px;background:linear-gradient(var(--accent),transparent);
      display:block}
    [data-theme="light"] .scroll-cue i{background:linear-gradient(var(--accent),transparent)}
    .hero [data-hero]{opacity:0;transform:translateY(16px);
      transition:opacity .8s var(--ease),transform .8s var(--ease)}
    .hero.hero-go [data-hero]{opacity:1;transform:none}
    .hero [data-d="1"]{transition-delay:.05s}.hero [data-d="2"]{transition-delay:.18s}
    .hero [data-d="3"]{transition-delay:.34s}.hero [data-d="4"]{transition-delay:.5s}
    .hero [data-d="5"]{transition-delay:.66s}.hero [data-d="6"]{transition-delay:.86s}
    @media (prefers-reduced-motion:no-preference){
      .hero h1 .grad{animation:sheen 7s ease-in-out infinite}
      @keyframes sheen{0%,100%{background-position:110% 0}50%{background-position:-10% 0}}
      .dot{animation:pulse 2.6s infinite}
      @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(52,209,123,.16)}50%{box-shadow:0 0 0 7px rgba(52,209,123,.07)}}
      .scroll-cue i{animation:drop 2.2s var(--ease) infinite}
      @keyframes drop{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
      .orbit{animation:spin 90s linear infinite}
      @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
    }

    /* ============ SOBRE ============ */
    .about-grid{display:grid;grid-template-columns:300px 1fr;gap:52px;align-items:start;margin-top:34px}
    @media(max-width:860px){.about-grid{grid-template-columns:1fr;gap:28px}}
    .photo{margin:0;position:sticky;top:calc(var(--nav-h) + 22px)}
    @media(max-width:860px){.photo{position:static;max-width:300px}}
    .photo-frame{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/4.6;
      border:1px solid var(--line);box-shadow:var(--shadow-lg);background:var(--surface-2)}
    .photo-frame img{width:100%;height:100%;object-fit:cover;display:block;position:relative}
    .photo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-size:44px;font-weight:800;color:var(--text-3)}
    .photo-cap{font-size:12.5px;color:var(--text-3);margin-top:10px;font-family:var(--mono)}
    .sec-label{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
      color:var(--accent);display:flex;align-items:center;gap:10px}
    .sec-label::after{content:"";height:1px;width:56px;background:var(--accent);opacity:.5}
    .about-grid h2,.blocks h2{font-size:clamp(1.7rem,3.2vw,2.4rem);margin-top:14px}
    .lede{color:var(--text-2);font-size:clamp(1rem,1.4vw,1.1rem);line-height:1.7;max-width:62ch}
    .about-grid .lede{margin-top:16px}
    .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;list-style:none;padding:0}
    .chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);
      border:1px solid var(--line);border-radius:var(--pill);padding:9px 18px;font-size:14px;
      font-weight:600;transition:transform .25s var(--ease),border-color .2s;
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
    .chip:hover{transform:translateY(-2px);border-color:var(--accent)}
    .chip i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;font-style:normal}

    /* ============ PROJETOS ============ */
    .blocks>p.lede{margin-top:14px}
    .proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
    @media(max-width:900px){.proj-grid{grid-template-columns:1fr}}
    .proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:26px;display:flex;flex-direction:column;gap:12px;
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
      transition:transform .35s var(--ease),box-shadow .35s,border-color .25s}
    .proj:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
    .proj-top{display:flex;align-items:center;justify-content:space-between}
    .proj-mark{width:40px;height:40px;border-radius:13px;background:var(--accent-soft);color:var(--accent);
      display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
    .proj h3{font-size:1.15rem}
    .proj p{font-size:14px;color:var(--text-2);line-height:1.65}
    .tags{display:flex;gap:7px;flex-wrap:wrap}
    .tag{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);
      border:1px solid var(--line-soft);padding:4px 11px;border-radius:var(--pill);color:var(--text-2)}
    .proj a.link{align-self:flex-start;font-size:14px;font-weight:650;color:var(--accent);
      text-decoration:none;border:1px solid var(--line);border-radius:var(--pill);padding:9px 20px;
      margin-top:4px;transition:background .2s,border-color .2s,transform .25s var(--ease)}
    .proj a.link:hover{background:var(--accent-soft);border-color:var(--accent);transform:translateX(3px)}
    .soon{margin-top:26px;border:1px dashed var(--line);border-radius:var(--r);padding:26px;
      text-align:center;color:var(--text-2);font-size:14.5px}
    .soon b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:6px}

    /* ============ CONTATO ============ */
    .contact{text-align:center}
    .contact .lede{margin:16px auto 0}
    .contact-grid{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
    .c-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:18px 22px;min-width:230px;text-align:left;
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
      transition:transform .3s var(--ease),box-shadow .3s,border-color .2s}
    .c-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--accent)}
    .c-card small{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;
      font-family:var(--mono)}
    .c-card b{font-size:15px;display:block;margin-top:6px}
    button.c-card{cursor:pointer;font:inherit;color:inherit;text-align:left}
    .mail-field{width:100%;background:var(--surface-2);border:1px solid var(--line-soft);
      border-radius:var(--pill);padding:9px 14px;font-size:12.5px;color:var(--text-2);
      font-family:var(--mono);margin-top:10px;overflow:hidden;text-overflow:ellipsis}
    .copy-hint{font-size:12.5px;color:var(--accent);font-weight:650;margin-top:8px;min-height:18px}
    .note{margin-top:20px;font-size:13px;color:var(--text-3);max-width:56ch;margin-left:auto;margin-right:auto}

    footer{border-top:1px solid var(--line-soft);padding:26px 0;position:relative;z-index:1}
    .foot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--text-3)}
    .foot .grow{flex:1}
    .foot button.linklike,.foot a{color:var(--text-3);text-decoration:none;background:none;border:0;
      font-size:13px;cursor:pointer;padding:6px 2px}
    .foot button.linklike:hover,.foot a:hover{color:var(--accent)}
    .sys{color:#34d17b;font-weight:600}

    /* ============ REVEAL / CURSOR / PROGRESSO ============ */
    .rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
    .rv.in{opacity:1;transform:none}
    .progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:150;background:var(--accent);
      transform:scaleX(0);transform-origin:0 50%}
    @supports (animation-timeline: scroll()){
      .progress{animation:prog linear both;animation-timeline:scroll()}
      @keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    }

    /* ============ PORTA DE ENTRADA ============ */
    .gate{position:fixed;inset:0;z-index:200;background:#04050c;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:26px;transition:opacity .7s var(--ease),visibility .7s}
    .gate.expand{opacity:0;visibility:hidden}
    .gate::before{content:"";position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(520px 340px at 50% 46%, rgba(124,102,255,.12), transparent 70%)}
    .gate::after{content:"";position:absolute;left:50%;top:46%;width:216px;height:216px;
      margin:-108px 0 0 -108px;border-radius:50%;border:1px solid rgba(200,190,255,.35);
      opacity:0;pointer-events:none}
    .gate.expand::after{opacity:1;animation:wave .8s var(--ease) both}
    @keyframes wave{from{transform:scale(.55);opacity:.8}to{transform:scale(6.5);opacity:0}}
    .gate-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;
      color:rgba(240,240,250,.45);margin:0;padding-left:.34em;transition:opacity .4s}
    .enter-btn{border:1px solid rgba(240,240,250,.28);background:transparent;color:#f2f3fa;
      border-radius:999px;padding:14px 48px;font-size:15px;font-weight:650;cursor:pointer;
      transition:border-color .25s,background .25s,transform .2s var(--ease)}
    .enter-btn:hover{border-color:var(--accent);background:rgba(143,123,255,.12)}
    .enter-btn:active{transform:scale(.97)}
    .enter-btn:focus-visible{outline:2px solid rgba(240,240,250,.85);outline-offset:6px}
    .site.revealing main{animation:rise .8s var(--ease) both}
    @keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
    @media(max-width:480px){.gate{gap:22px}}
    @media (prefers-reduced-motion:no-preference){
      .enter-btn{transition:border-color .25s,background .25s,transform .2s var(--ease)}
    }
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation:none!important;transition:none!important}
      .rv,.hero [data-hero]{opacity:1!important;transform:none!important}
      .progress{display:none}
      .gate{transition:opacity .18s ease!important}
      .gate.expand{opacity:0!important}
      .gate.expand::after{display:none}
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>

  <div id="root"></div>
  <noscript><div style="max-width:640px;margin:80px auto;padding:0 24px;font-family:sans-serif"><h1>Wesley Melo</h1><p>Ative o JavaScript para ver o portfólio interativo.</p></div></noscript>
  <!-- ============================================================
    COMPONENTES + DADOS + APP
  ============================================================ -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    /* ---------- DADOS (só o confirmado; resto é "em breve") ---------- */
    const EMAIL = "wesleysantosmelo2022@gmail.com";
    const PROJECTS = [
      { mark:"F", title:"Finora", desc:"Dashboard financeiro funcional: KPIs, gráficos em SVG, transações com CRUD local, busca, filtros e dark mode.",
        tech:["React","JavaScript","CSS","SVG"], demo:"portfolio-projects/finora/index.html" },
      { mark:"T", title:"Taskly", desc:"Kanban funcional com 4 colunas: drag and drop com alternativa por teclado, filtros, ordenação, atalhos e persistência local.",
        tech:["React","JavaScript","CSS"], demo:"portfolio-projects/taskly/index.html" },
      { mark:"N", title:"Nexa", desc:"Landing page de um SaaS fictício: hero, showcase com abas, planos mensal/anual, FAQ, cadastro simulado e dark mode.",
        tech:["React","JavaScript","CSS"], demo:"portfolio-projects/nexa/index.html" },
    ];
    const INTERESTS = ["Tecnologia e computadores","Desenvolvimento web","Automação · n8n","Experiências digitais","Projetos e experimentos"];

    /* ---------- FUNDO DE ESTRELAS (canvas leve) ---------- */
    function Starfield(){
      const ref = useRef(null);
      useEffect(()=>{
        const cv = ref.current; if(!cv) return;
        const ctx = cv.getContext("2d");
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let stars = [], raf = 0, w = 0, h = 0;
        const dark = () => document.documentElement.dataset.theme === "dark";
        const build = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = window.innerWidth; h = window.innerHeight;
          cv.width = w * dpr; cv.height = h * dpr;
          cv.style.width = w + "px"; cv.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const n = Math.min(170, Math.floor(w * h / 11000));
          const tints = ["255,255,255","255,255,255","200,210,255","215,195,255"];
          stars = Array.from({length:n},()=>({
            x:Math.random()*w, y:Math.random()*h,
            r:Math.random()*1.3+0.3, c:tints[Math.floor(Math.random()*tints.length)],
            p:Math.random()*Math.PI*2, s:0.4+Math.random()*0.8
          }));
        };
        const draw = t => {
          ctx.clearRect(0,0,w,h);
          const dim = dark() ? 1 : 0.28;
          for(const s of stars){
            const tw = reduce ? 0.75 : 0.55 + 0.45 * Math.sin(t/1000*s.s + s.p);
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(${s.c},${(tw*dim).toFixed(3)})`;
            ctx.fill();
          }
          if(!reduce) raf = requestAnimationFrame(draw);
        };
        build(); draw(0);
        let rT;
        const onR = () => { clearTimeout(rT); rT = setTimeout(()=>{ build(); if(reduce) draw(0); }, 200); };
        const onVis = () => { if(reduce) return; if(document.hidden) cancelAnimationFrame(raf); else { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); } };
        window.addEventListener("resize", onR);
        document.addEventListener("visibilitychange", onVis);
        return ()=>{ window.removeEventListener("resize", onR); document.removeEventListener("visibilitychange", onVis); cancelAnimationFrame(raf); };
      },[]);
      return <canvas className="stars" ref={ref} aria-hidden="true"/>;
    }

    /* ---------- REVEAL ---------- */
    function Reveal({children, as:Tag="div", className="", delay=0}){
      const ref = useRef(null);
      useEffect(()=>{
        const el = ref.current; if(!el) return;
        if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ el.classList.add("in"); return; }
        const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ el.classList.add("in"); io.disconnect(); } }),{threshold:.12});
        io.observe(el); return ()=>io.disconnect();
      },[]);
      return <Tag ref={ref} className={"rv "+className} style={{transitionDelay:delay+"ms"}}>{children}</Tag>;
    }

    function Magnetic({children}){
      const ref = useRef(null);
      useEffect(()=>{
        const el = ref.current; if(!el) return;
        if(!window.matchMedia("(pointer: fine)").matches) return;
        if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const mv = e => {
          const r = el.getBoundingClientRect();
          el.style.transform = `translate(${((e.clientX-r.left-r.width/2)/r.width*6).toFixed(1)}px,${((e.clientY-r.top-r.height/2)/r.height*4).toFixed(1)}px)`;
        };
        const lv = () => { el.style.transform = ""; };
        el.addEventListener("mousemove", mv); el.addEventListener("mouseleave", lv);
        return ()=>{ el.removeEventListener("mousemove", mv); el.removeEventListener("mouseleave", lv); };
      },[]);
      return <span ref={ref} style={{display:"inline-flex",transition:"transform .25s cubic-bezier(.16,1,.3,1)"}}>{children}</span>;
    }

    /* ---------- APP ---------- */
    function App(){
      const [theme, setTheme] = useState(document.documentElement.dataset.theme || "dark");
      const [scrolled, setScrolled] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [gate, setGate] = useState("idle");
      const [copied, setCopied] = useState(false);
      const menuBtnRef = useRef(null);

      useEffect(()=>{ document.documentElement.dataset.theme = theme; try{ localStorage.setItem("wsm.theme", theme); }catch(e){} },[theme]);
      useEffect(()=>{
        const onS = () => setScrolled(window.scrollY > 10);
        onS(); window.addEventListener("scroll", onS, {passive:true});
        return ()=>window.removeEventListener("scroll", onS);
      },[]);
      useEffect(()=>{
        const onKey = e => {
          if(e.key === "Escape"){ setMenuOpen(false); }
        };
        document.addEventListener("keydown", onKey);
        return ()=>document.removeEventListener("keydown", onKey);
      },[]);

      /* Entrada simples: um clique e o site abre */
      useEffect(()=>{
        if(gate === "done") return;
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        document.body.style.overflow = "hidden";
        if(gate === "expand"){
          const t = setTimeout(()=>{ document.body.style.overflow = ""; setGate("done"); }, reduce ? 200 : 450);
          return ()=>clearTimeout(t);
        }
      },[gate]);
      const enter = () => { if(gate === "idle") setGate("expand"); };

      const copyEmail = async () => {
        const field = document.getElementById("email-field");
        const sel = () => { if(field){ field.focus(); field.select(); field.setSelectionRange(0, 9999); } };
        try{
          if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(EMAIL);
          else { sel(); if(!document.execCommand("copy")) throw new Error("copy failed"); }
          setCopied(true); setTimeout(()=>setCopied(false), 2000);
        }catch(err){ sel(); }
      };

      return (
        <React.Fragment>
          <Starfield/>
          <div className="nebula neb-a" aria-hidden="true"/>
          <div className="nebula neb-b" aria-hidden="true"/>
          <div className="nebula neb-c" aria-hidden="true"/>
          <div className="progress" aria-hidden="true"/>

          {gate !== "done" && (
            <div className={"gate" + (gate === "expand" ? " expand" : "")} role="dialog" aria-modal="true" aria-label="Entrada do portfólio">
              <p className="gate-eyebrow">Wesley Melo · portfólio</p>
              <button type="button" className="enter-btn" onClick={enter} autoFocus>Entrar →</button>
            </div>
          )}

          <div className={"site" + (gate === "done" ? " revealed" : gate === "expand" ? " revealing" : " locked")} aria-hidden={gate !== "done" ? true : undefined}>
          <header className={"nav" + (scrolled ? " scrolled" : "")}>
            <div className="nav-in">
              <a className="brand" href="#inicio" aria-label="Wesley Melo, voltar ao início">
                <span className="brand-mark" aria-hidden="true">WM</span>Wesley Melo
              </a>
              <nav aria-label="Navegação principal">
                <ul className="links">
                  <li><a href="#sobre">Sobre</a></li>
                  <li><a href="#projetos">Projetos</a></li>
                  <li><a href="#contato">Contato</a></li>
                </ul>
              </nav>
              <div className="nav-act">
                <button type="button" className="icon-btn" onClick={()=>setTheme(t=>t==="light"?"dark":"light")}
                  aria-label={theme === "light" ? "Ativar modo escuro" : "Ativar modo claro"}
                  title={theme === "light" ? "Modo escuro" : "Modo claro"}>
                  {theme === "light" ? "☾" : "☀"}
                </button>
                <button ref={menuBtnRef} type="button" className="icon-btn menu-btn"
                  aria-expanded={menuOpen} aria-controls="menu-mobile"
                  aria-label={menuOpen ? "Fechar menu" : "Abrir menu"}
                  onClick={()=>setMenuOpen(v=>!v)}>
                  {menuOpen ? "✕" : "☰"}
                </button>
              </div>
            </div>
          </header>

          <div id="menu-mobile" className={"m-panel" + (menuOpen ? " open" : "")} hidden={!menuOpen}>
            <nav aria-label="Navegação móvel">
              <a href="#sobre" onClick={()=>setMenuOpen(false)}>Sobre <span>→</span></a>
              <a href="#projetos" onClick={()=>setMenuOpen(false)}>Projetos <span>→</span></a>
              <a href="#contato" onClick={()=>setMenuOpen(false)}>Contato <span>→</span></a>
            </nav>
          </div>

          <main id="conteudo">
            {/* ===== HERO ===== */}
            <section className={"hero" + (gate === "done" ? " hero-go" : "")} id="inicio" aria-labelledby="hero-title">
              <div className="wrap hero-inner">
                <div className="orbit" aria-hidden="true">
                  <svg viewBox="0 0 200 200" fill="none">
                    <circle cx="100" cy="100" r="96" stroke="currentColor" strokeOpacity=".14"/>
                    <circle cx="100" cy="100" r="70" stroke="currentColor" strokeOpacity=".1" strokeDasharray="3 6"/>
                    <circle cx="196" cy="100" r="2.5" fill="currentColor" fillOpacity=".5"/>
                    <circle cx="42" cy="42" r="1.6" fill="currentColor" fillOpacity=".4"/>
                  </svg>
                </div>
                <p className="eyebrow" data-hero data-d="1">// portfólio</p>
                <h1 id="hero-title" data-hero data-d="2">Wesley <span className="grad">Melo</span></h1>
                <p className="tagline" data-hero data-d="3">Explorando ideias, desenvolvendo soluções e transformando criatividade em projetos digitais.</p>
                <div className="btn-row" data-hero data-d="4">
                  <Magnetic><a className="btn btn-p" href="#projetos">Projetos ↓</a></Magnetic>
                  <Magnetic><a className="btn btn-g" href="#contato">Entre em contato →</a></Magnetic>
                </div>
                <div data-hero data-d="5">
                  <span className="status"><span className="dot" aria-hidden="true"></span>Disponível para estágio e júnior</span>
                </div>
                <p className="scroll-cue" data-hero data-d="6" aria-hidden="true">role para explorar<i/></p>
              </div>
            </section>

            {/* ===== SOBRE ===== */}
            <section id="sobre" aria-labelledby="sobre-title">
              <div className="wrap">
                <div className="about-grid">
                  <Reveal className="photo" delay={60}>
                    <figure className="photo-frame" style={{margin:0}}>
                      <span className="photo-fallback" aria-hidden="true">WM</span>
                      {/* Foto: salve como foto.png (transparência) ou foto.jpg na mesma pasta */}
                      <img src="foto.png" alt="Foto de Wesley Melo" onError={(e)=>{ const el=e.currentTarget; if(!el.dataset.fb){ el.dataset.fb="1"; el.src="foto.jpg"; } else { el.style.display="none"; } }} />
                    </figure>
                    <p className="photo-cap">Wesley Melo · tecnologia & desenvolvimento</p>
                  </Reveal>
                  <div>
                    <Reveal>
                      <span className="sec-label">Sobre mim</span>
                      <h2 id="sobre-title" style={{marginTop:"14px"}}>Prazer, Wesley.</h2>
                    </Reveal>
                    <Reveal delay={100}>
                      <p className="lede" style={{marginTop:"16px"}}>Sou Wesley Melo e gosto de explorar o universo da tecnologia, desenvolver ideias e descobrir novas formas de transformar conceitos em experiências digitais.</p>
                      <p className="lede" style={{marginTop:"14px"}}>Tenho interesse em desenvolvimento de sites, automação — incluindo ferramentas como n8n — e em experimentar soluções que melhorem projetos digitais. Aprendo na prática: testando ferramentas, construindo e evoluindo a cada projeto.</p>
                    </Reveal>
                    <Reveal as="ul" className="chips" delay={160} aria-label="Interesses">
                      {INTERESTS.map(t=>(<li key={t} className="chip"><i aria-hidden="true"/> {t}</li>))}
                    </Reveal>
                  </div>
                </div>
              </div>
            </section>

            {/* ===== PROJETOS ===== */}
            <section id="projetos" className="blocks" aria-labelledby="projetos-title">
              <div className="wrap">
                <Reveal>
                  <span className="sec-label">Projetos</span>
                  <h2 id="projetos-title" style={{marginTop:"14px"}}>Demonstrações em órbita</h2>
                  <p className="lede">Projetos demonstrativos desenvolvidos para estudo e portfólio — funcionais, com dados fictícios e código em publicação.</p>
                </Reveal>
                <div className="proj-grid">
                  {PROJECTS.map((p,i)=>(
                    <Reveal key={p.title} delay={Math.min(i*80,240)}>
                      <article className="proj">
                        <div className="proj-top">
                          <span className="proj-mark" aria-hidden="true">{p.mark}</span>
                        </div>
                        <h3>{p.title}</h3>
                        <p>{p.desc}</p>
                        <div className="tags" aria-label={"Tecnologias de " + p.title}>
                          {p.tech.map(t=>(<span key={t} className="tag">{t}</span>))}
                        </div>
                        <a className="link" href={p.demo} aria-label={"Abrir demonstração: " + p.title}>Abrir demonstração →</a>
                      </article>
                    </Reveal>
                  ))}
                </div>
                <Reveal delay={120}>
                  <div className="soon">
                    <b>Novos projetos a caminho</b>
                    Mais experimentos entram em órbita conforme evoluo — incluindo automações e integrações.
                  </div>
                </Reveal>
              </div>
            </section>

            {/* ===== CONTATO ===== */}
            <section id="contato" aria-labelledby="contato-title">
              <div className="wrap contact">
                <Reveal>
                  <h2 id="contato-title">Entre em contato</h2>
                  <p className="lede">Aberto a estágio, vagas júnior e conversas sobre tecnologia. Clique no card para copiar meu e-mail.</p>
                </Reveal>
                <Reveal delay={100}>
                  <div className="contact-grid">
                    <button type="button" className="c-card" onClick={copyEmail} aria-label="Copiar endereço de e-mail">
                      <small>E-mail</small>
                      <b aria-live="polite">{copied ? "✓ E-mail copiado!" : EMAIL}</b>
                      <input id="email-field" className="mail-field" type="text" readOnly value={EMAIL}
                        onFocus={(e)=>e.target.select()} aria-label="Endereço de e-mail. Pressione Ctrl+C para copiar"
                        onClick={(e)=>e.stopPropagation()} />
                      <p className="copy-hint">{copied ? "Colado na área de transferência ✓" : "clique para copiar"}</p>
                    </button>
                    <div className="c-card" aria-label="GitHub, link em breve">
                      <small>GitHub</small>
                      <b>Em breve</b>
                      <p className="copy-hint" style={{color:"var(--text-3)"}}>perfil em construção</p>
                    </div>
                    <div className="c-card" aria-label="LinkedIn, link em breve">
                      <small>LinkedIn</small>
                      <b>Em breve</b>
                      <p className="copy-hint" style={{color:"var(--text-3)"}}>perfil em construção</p>
                    </div>
                  </div>
                  <p className="note">GitHub e LinkedIn serão vinculados aqui assim que os perfis estiverem prontos. Nenhum link foi inventado.</p>
                </Reveal>
              </div>
            </section>
          </main>

          <footer>
            <div className="wrap foot">
              <span>© 2026 Wesley Melo · <span className="sys">● online</span></span>
              <span className="grow"/>
              <button type="button" className="linklike" onClick={()=>window.location.reload()}>Rever abertura ↺</button>
              <a href="#inicio">Voltar ao topo ↑</a>
            </div>
          </footer>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
