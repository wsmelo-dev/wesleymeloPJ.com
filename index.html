<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wesley Santos de Melo — Frontend Developer</title>
  <meta name="description" content="Portfólio de Wesley Santos de Melo, Frontend Developer em formação. Interfaces modernas, acessíveis e com atenção aos detalhes. Aberto a estágio e vagas júnior.">
  <meta name="author" content="Wesley Santos de Melo">
  <meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Wesley Santos de Melo — Frontend Developer">
  <meta property="og:description" content="Interfaces modernas, acessíveis e bem construídas. Aberto a estágio e vagas júnior em desenvolvimento.">
  <!-- ============================================================
    CONFIGURAÇÃO
    Single-file portfolio. Sem Node, sem build, sem npm.
    Abrir index.html direto no navegador.
    Dependências (CDN, somente 3): React, ReactDOM, Babel.
    Regra de forma: pills=999px · cards=18px · internos=12px
    Cor de acento única: --accent #0071E3 (lock global)
  ============================================================ -->
  <style>
    /* ============ TOKENS ============ */
    :root{
      --bg:#FBFBFD;
      --bg-soft:#F5F5F7;
      --surface:#FFFFFF;
      --surface-2:#F5F5F7;
      --text:#1D1D1F;
      --text-2:#515154;
      --text-3:#6E6E73;
      --line:rgba(0,0,0,.09);
      --line-soft:rgba(0,0,0,.06);
      --accent:#0071E3;
      --accent-hover:#0077ED;
      --accent-ink:#FFFFFF;
      --accent-soft:rgba(0,113,227,.09);
      --nav-bg:rgba(251,251,253,.72);
      --shadow-sm:0 1px 2px rgba(0,0,0,.05);
      --shadow-md:0 8px 30px rgba(0,0,0,.08);
      --shadow-lg:0 24px 70px rgba(0,0,0,.12);
      --r-card:18px;
      --r-inner:12px;
      --r-pill:999px;
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Arial,sans-serif;
      --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
      --max:1120px;
      --nav-h:64px;
      --ease:cubic-bezier(.16,1,.3,1);
    }
    [data-theme="dark"]{
      --bg:#0B0B0D;
      --bg-soft:#131316;
      --surface:#161619;
      --surface-2:#1C1C1F;
      --text:#F5F5F7;
      --text-2:#C7C7CC;
      --text-3:#98989F;
      --line:rgba(255,255,255,.12);
      --line-soft:rgba(255,255,255,.07);
      --accent:#2997FF;
      --accent-hover:#53A9FF;
      --accent-ink:#06121F;
      --accent-soft:rgba(41,151,255,.14);
      --nav-bg:rgba(11,11,13,.68);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 8px 30px rgba(0,0,0,.45);
      --shadow-lg:0 24px 70px rgba(0,0,0,.55);
    }

    /* ============ BASE ============ */
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
    body{
      margin:0;font-family:var(--font);
      background:var(--bg);color:var(--text);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
      line-height:1.5;
    }
    ::selection{background:var(--accent);color:#fff}
    [data-theme="dark"] ::selection{color:#06121F}
    body::before{content:"";position:fixed;top:0;left:0;right:0;height:620px;z-index:0;pointer-events:none;background:radial-gradient(640px 340px at 50% -90px, var(--accent-soft), transparent 70%)}
    main{position:relative;z-index:1}
    a{color:inherit}
    img{max-width:100%;display:block}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
    main{display:block}
    section{padding:96px 0}
    @media(max-width:768px){section{padding:64px 0}}

    .skip{
      position:absolute;left:16px;top:-60px;z-index:200;
      background:var(--text);color:var(--bg);
      padding:10px 18px;border-radius:var(--r-pill);
      font-size:14px;font-weight:600;text-decoration:none;
      transition:top .2s var(--ease);
    }
    .skip:focus{top:12px}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

    h1,h2,h3{letter-spacing:-.03em;line-height:1.06;margin:0;text-wrap:balance}
    h1{font-size:clamp(2.5rem,5.2vw,4rem);font-weight:700}
    h2{font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:700}
    h3{font-size:1.1rem;font-weight:650;line-height:1.3}
    p{margin:0}
    .lede{color:var(--text-2);font-size:clamp(1rem,1.4vw,1.13rem);line-height:1.65;max-width:60ch}
    .kicker{
      display:inline-flex;align-items:center;gap:8px;
      font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--text-3);
    }
    .kicker::before{content:"";width:22px;height:1px;background:var(--text-3);opacity:.6}

    /* ============ NAV ============ */
    .nav{
      position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:100;
      background:transparent;border-bottom:1px solid transparent;
      transition:background .3s var(--ease),border-color .3s,backdrop-filter .3s;
    }
    .nav.scrolled{
      background:var(--nav-bg);
      -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
      border-bottom-color:var(--line-soft);
    }
    .nav-inner{max-width:var(--max);margin:0 auto;padding:0 24px;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:700;font-size:15px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
    .brand small{font-weight:500;color:var(--text-3)}
    .nav-links{display:flex;align-items:center;gap:4px;list-style:none;margin:0;padding:0}
    .nav-links a{
      text-decoration:none;font-size:14px;font-weight:500;color:var(--text-2);
      padding:8px 14px;border-radius:var(--r-pill);transition:background .2s,color .2s;
    }
    .nav-links a:hover{background:var(--accent-soft);color:var(--text)}
    .nav-actions{display:flex;align-items:center;gap:8px}
    .theme-btn,.menu-btn{
      border:1px solid var(--line);background:var(--surface);color:var(--text);
      width:38px;height:38px;border-radius:50%;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;
      transition:transform .2s var(--ease),border-color .2s,background .2s;
    }
    .theme-btn:hover,.menu-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
    .theme-btn:active,.menu-btn:active{transform:scale(.96)}
    .menu-btn{display:none;font-size:18px}
    .mobile-panel{display:none}
    @media(max-width:820px){
      .nav-links{display:none}
      .menu-btn{display:inline-flex}
      .mobile-panel{
        display:block;position:fixed;top:var(--nav-h);left:12px;right:12px;z-index:99;
        background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
        box-shadow:var(--shadow-lg);padding:8px;
        opacity:0;transform:translateY(-8px);pointer-events:none;
        transition:opacity .25s var(--ease),transform .25s var(--ease);
      }
      .mobile-panel.open{opacity:1;transform:none;pointer-events:auto}
      .mobile-panel a{
        display:flex;align-items:center;justify-content:space-between;
        padding:14px 16px;border-radius:var(--r-inner);text-decoration:none;
        font-size:16px;font-weight:600;
      }
      .mobile-panel a:hover,.mobile-panel a:focus-visible{background:var(--surface-2)}
      .mobile-panel a span:last-child{color:var(--text-3);font-weight:400}
    }

    /* ============ BOTÕES (shadcn-inspired, 1 label por intenção) ============ */
    .btn{
      appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
      min-height:48px;padding:0 28px;border-radius:var(--r-pill);
      font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;
      border:1px solid transparent;white-space:nowrap;
      transition:transform .25s var(--ease),box-shadow .25s,background .2s,border-color .2s;
    }
    .btn:active{transform:scale(.98) translateY(1px)}
    .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 22px rgba(0,113,227,.28)}
    [data-theme="dark"] .btn-primary{color:#06121F}
    .btn-primary:hover{background:var(--accent-hover);box-shadow:0 10px 30px rgba(0,113,227,.34)}
    .btn-ghost{background:transparent;color:var(--accent);border-color:var(--line)}
    .btn-ghost:hover{border-color:var(--accent);background:var(--accent-soft)}
    .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}

    /* ============ HERO (split 50/50, anti-center-bias) ============ */
    .hero{padding:calc(var(--nav-h) + 56px) 0 72px;position:relative;overflow:clip}
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
    @media(max-width:920px){.hero-grid{grid-template-columns:1fr;gap:40px}}
    .status{
      display:inline-flex;align-items:center;gap:9px;
      border:1px solid var(--line);background:var(--surface);
      border-radius:var(--r-pill);padding:7px 14px 7px 10px;
      font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:22px;
      box-shadow:var(--shadow-sm);
    }
    .dot{width:8px;height:8px;border-radius:50%;background:#30D158;box-shadow:0 0 0 4px rgba(48,209,88,.18);flex:none}
    @media (prefers-reduced-motion:no-preference){
      .dot{animation:pulse 2.4s infinite}
      @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(48,209,88,.18)}50%{box-shadow:0 0 0 7px rgba(48,209,88,.08)}}
    }
    .hero h1 .accent{color:var(--accent)}
    .hero-sub{margin-top:18px;color:var(--text-2);font-size:clamp(1rem,1.5vw,1.15rem);line-height:1.65;max-width:46ch}
    .hero-sub strong{color:var(--accent)}
    .hero-meta{display:flex;gap:20px;margin-top:26px;flex-wrap:wrap}
    .hero-meta div{display:flex;flex-direction:column}
    .hero-meta strong{font-size:15px}
    .hero-meta span{font-size:13px;color:var(--text-3)}
    .scroll-hint{margin-top:44px;display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:13px}
    .mouse{width:22px;height:34px;border:1.5px solid var(--text-3);border-radius:12px;position:relative;opacity:.7}
    .mouse::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:3px;background:var(--text-3)}
    @media (prefers-reduced-motion:no-preference){.mouse::after{animation:wheel 1.8s infinite}.hero-visual{animation:floaty 7s ease-in-out infinite}}
    @keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(8px);opacity:0}100%{opacity:0}}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

    /* Janela de código: preview real de componente, não screenshot falso */
    .hero-visual{display:grid;gap:16px;position:relative;isolation:isolate}
    .hero-visual::before{content:"";position:absolute;inset:6% -6% -8%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side, var(--accent-soft), transparent);filter:blur(46px)}
    .window{
      background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
      box-shadow:var(--shadow-lg);overflow:hidden;
    }
    .window-bar{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
    .traffic{display:flex;gap:7px}
    .traffic i{width:11px;height:11px;border-radius:50%;display:block}
    .traffic i:nth-child(1){background:#FF5F57}.traffic i:nth-child(2){background:#FEBC2E}.traffic i:nth-child(3){background:#28C840}
    .window-bar code{font-family:var(--mono);font-size:12px;color:var(--text-3);margin-left:6px}
    .code{padding:18px 20px;font-family:var(--mono);font-size:12.8px;line-height:1.75;overflow-x:auto}
    .code .k{color:var(--accent)} .code .s{color:#30B651} [data-theme="dark"] .code .s{color:#7DDC8A}
    .code .f{color:var(--text)} .code .c{color:var(--text-3);font-style:normal}
    .hero-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:480px){.hero-cards{grid-template-columns:1fr}}
    .mini{
      background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
      padding:18px;box-shadow:var(--shadow-sm);
      transition:transform .3s var(--ease),box-shadow .3s;
    }
    .mini:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
    .mini h3{font-size:13px;font-family:var(--mono);font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
    .bars{display:flex;align-items:flex-end;gap:6px;height:56px}
    .bars i{flex:1;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-soft);min-height:8px}
    .bars i.fill{background:var(--accent);border-color:transparent;transform-origin:bottom}
    @media (prefers-reduced-motion:no-preference){
      .bars i.fill{animation:grow .9s var(--ease) both}
      .bars i.fill:nth-child(2){animation-delay:.15s}
      .bars i.fill:nth-child(4){animation-delay:.3s}
      .bars i.fill:nth-child(6){animation-delay:.45s}
      @keyframes grow{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
    }
    .check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
    .check:last-child{border-bottom:0}
    .box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none;background:var(--surface)}
    .box.done{background:var(--accent);border-color:var(--accent);color:#fff}
    .check s{color:var(--text-3)}

    /* ============ SOBRE ============ */
    .about{border-top:1px solid var(--line-soft)}
    .about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;margin-top:32px}
    @media(max-width:860px){.about-grid{grid-template-columns:1fr;gap:28px}}
    .portrait{
      background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
      padding:32px;box-shadow:var(--shadow-sm);position:sticky;top:calc(var(--nav-h) + 20px);align-self:start;
      overflow:hidden;
    }
    .portrait::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg, var(--accent), transparent)}
    @media(max-width:860px){.portrait{position:static}}
    .photo-frame{position:relative;margin:0 0 4px;width:100%;aspect-ratio:4/3;border-radius:var(--r-inner);overflow:hidden;background:var(--surface-2);border:1px solid var(--line-soft)}
    .photo-frame img{width:100%;height:100%;object-fit:cover;display:block;position:relative}
    .photo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:var(--text-3);background:linear-gradient(135deg,var(--accent-soft),transparent)}
    .portrait h3{margin:16px 0 4px;font-size:19px}
    .portrait p.role{color:var(--text-3);font-size:14px;margin-bottom:16px}
    .facts{list-style:none;margin:20px 0 0;padding:20px 0 0;border-top:1px solid var(--line-soft);display:grid;gap:12px;font-size:14px;color:var(--text-2)}
    .facts li{display:flex;gap:10px;align-items:flex-start}
    .facts b{color:var(--text)}
    .values{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
    @media(max-width:520px){.values{grid-template-columns:1fr}}
    .value{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-inner);padding:18px;transition:transform .3s var(--ease),box-shadow .3s}
    .value:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .value span{display:inline-flex;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);align-items:center;justify-content:center;font-size:17px}
    .value h3{font-size:15px;margin:10px 0 6px}
    .value p{font-size:14px;color:var(--text-2);line-height:1.6}

    /* ============ SKILLS ============ */
    .skills{background:var(--bg-soft);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
    .skills-head{max-width:640px}
    .stack{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;list-style:none;padding:0}
    .chip{
      display:inline-flex;align-items:center;gap:9px;
      background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);
      padding:10px 18px 10px 12px;font-size:14px;font-weight:600;cursor:default;
      transition:transform .25s var(--ease),border-color .2s,box-shadow .25s;
    }
    .chip:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow-sm)}
    .chip i{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:15px}
    .chip small{font-weight:500;color:var(--text-3);font-size:12px}
    .learn{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
    @media(max-width:760px){.learn{grid-template-columns:1fr}}
    .learn article{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:var(--r-inner);padding:20px}
    .learn h3{font-size:14px;font-family:var(--mono);font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
    .learn p{font-size:14px;color:var(--text-2)}
    .note{margin-top:18px;font-size:13.5px;color:var(--text-3)}

    /* ============ PROJETOS (assimétrico 1+2) ============ */
    .proj-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin-top:36px}
    .proj-grid .col{display:grid;gap:20px;align-content:start}
    @media(max-width:860px){.proj-grid{grid-template-columns:1fr}}
    .card{
      background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
      overflow:hidden;box-shadow:var(--shadow-sm);
      transition:transform .35s var(--ease),box-shadow .35s;
      display:flex;flex-direction:column;
    }
    .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:rgba(0,113,227,.35)}
    [data-theme="dark"] .card:hover{border-color:rgba(41,151,255,.4)}
    .preview{border-bottom:1px solid var(--line-soft);padding:26px;background:var(--surface-2);min-height:190px;display:flex;align-items:center;justify-content:center}
    .preview .frame{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-inner);box-shadow:var(--shadow-sm);padding:18px;width:100%;max-width:420px}
    .frame-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .frame-row strong{font-size:14px}
    .frame-row span{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:var(--r-pill);font-weight:600}
    .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    .kpi div{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px;text-align:center}
    .kpi b{display:block;font-size:15px} .kpi small{font-size:11px;color:var(--text-3)}
    .spark{display:flex;align-items:flex-end;gap:5px;height:44px}
    .spark i{flex:1;border-radius:4px;background:var(--accent);opacity:.25;min-height:6px}
    .spark i:nth-child(3),.spark i:nth-child(5),.spark i:nth-child(6){opacity:.9}
    .task-demo{display:grid;gap:8px}
    .task-demo div{display:flex;align-items:center;gap:10px;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}
    .saas-mock{text-align:center}
    .saas-mock b{display:block;font-size:17px;letter-spacing:-.02em}
    .saas-mock p{font-size:13px;color:var(--text-3);margin:6px 0 12px}
    .saas-mock .fake-cta{display:inline-block;background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:9px 20px;border-radius:var(--r-pill)}
    .card-body{padding:26px;display:grid;gap:12px;align-content:start}
    .tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .tag{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line-soft);padding:5px 11px;border-radius:var(--r-pill);color:var(--text-2)}
    .tag.concept{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
    .card-body p{font-size:14.5px;color:var(--text-2);line-height:1.65}
    .card-links{display:flex;gap:10px;margin-top:4px}
    .link-btn{
      font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;
      border:1px solid var(--line);border-radius:var(--r-pill);padding:9px 18px;
      transition:background .2s,border-color .2s;
    }
    .link-btn:hover{background:var(--accent-soft);border-color:var(--accent)}

      return [theme, () => setTheme(t => (t === "light" ? "dark" : "light"))];

    /* Reveal on scroll via IntersectionObserver (sem scroll listener) */
    function Reveal({ children, as: Tag = "div", className = "", delay = 0, label }) {
      const ref = useRef(null);

        const el = ref.current;
        if (!el) return;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          el.classList.add("in"); return;
        }
        const io = new IntersectionObserver(
          (entries) => entries.forEach(e => {
            if (e.isIntersecting) { el.classList.add("in"); io.disconnect(); }
          }),
          { threshold: 0.15 }
        );
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return <Tag ref={ref} className={"rv " + className} style={{ transitionDelay: delay + "ms" }}>{children}</Tag>;
    }

              style={reduce ? undefined : { transitionDelay: Math.min(i * 22, 700) + "ms" }}

    /* Botão com micro-física magnética moderada (desliga em touch / reduced motion) */
    function Magnetic({ children }) {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const fine = window.matchMedia("(pointer: fine)").matches;
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!fine || reduce) return;
        const move = (e) => {
          const r = el.getBoundingClientRect();
          const x = (e.clientX - r.left - r.width / 2) / r.width;
          const y = (e.clientY - r.top - r.height / 2) / r.height;
          el.style.transform = `translate(${x * 6}px, ${y * 4}px)`;
        };
        const leave = () => { el.style.transform = ""; };
        el.addEventListener("mousemove", move);
        el.addEventListener("mouseleave", leave);
        return () => { el.removeEventListener("mousemove", move); el.removeEventListener("mouseleave", leave); };

                    <div className="mini">
                      <h3>Atividade</h3>
                      <div className="bars" aria-hidden="true">
                        <i style={{height:"35%"}}/><i className="fill" style={{height:"60%"}}/><i style={{height:"45%"}}/><i className="fill" style={{height:"85%"}}/><i style={{height:"55%"}}/><i className="fill" style={{height:"100%"}}/>
                      </div>
                    </div>
                    <div className="mini">
                      <h3>Hoje</h3>
                      <div className="check"><span className="box done">✓</span><s>CSS Grid</s></div>
                      <div className="check"><span className="box done">✓</span><s>React props</s></div>
                      <div className="check"><span className="box"></span>Acessibilidade</div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ===== SOBRE ===== */}
            <section className="about" id="sobre" aria-labelledby="sobre-title">
              <div className="wrap">
                <Reveal><h2 id="sobre-title">Software, sistemas<br />e programação.</h2></Reveal>
                <div className="about-grid">
                  <Reveal className="portrait" delay={80}>
                    <figure className="photo-frame">
                      <span className="photo-fallback" aria-hidden="true">WM</span>
                      {/* Foto fixa: salve como foto.png (recomendado, preserva transparência) ou foto.jpg, na mesma pasta do index.html */}
                      <img src="foto.png" alt="Foto de Wesley Santos de Melo" onError={(e) => { const el = e.currentTarget; if (!el.dataset.fb) { el.dataset.fb = "1"; el.src = "foto.jpg"; } else { el.style.display = "none"; } }} />
                    </figure>
                    <h3>Wesley Santos de Melo</h3>
                    <p className="role">Desenvolvedor de software · Brasil</p>
                    <p className="lede" style={{fontSize:"14.5px"}}>No início da carreira em programação, com foco em construir software e sistemas bem feitos, do front-end aos fundamentos.</p>
                    <ul className="facts">
                      <li>▸ <span><b>Foco atual:</b> lógica de programação, JavaScript e React</span></li>
                      <li>▸ <span><b>Como aprendo:</b> programando projetos e estudando fundamentos de sistemas</span></li>
                      <li>▸ <span><b>Próximo passo:</b> estágio ou vaga júnior em tecnologia</span></li>
                    </ul>
                  </Reveal>
                  <div>
                    <Reveal delay={120}>
                      <p className="lede">O que me atrai em tecnologia é entender como o software funciona: a lógica por trás de um programa, como os dados circulam em um sistema e como uma boa programação transforma uma ideia em algo que realmente funciona.</p>
                      <p className="lede" style={{marginTop:"16px"}}>Comecei pelo desenvolvimento front-end, criando interfaces com HTML, CSS, JavaScript e React, e sigo aprofundando lógica de programação e fundamentos de sistemas. Ainda não tenho experiência profissional, e prefiro ser transparente sobre isso, do que pareço pronto: alguém que estuda com constância e quer crescer dentro da área de software.</p>
                    </Reveal>
                    <div className="values">
                      {[
                        { e: "◍", t: "Lógica de programação", d: "Resolução de problemas, algoritmos e estruturas de dados na rotina de estudos." },
                        { e: "◎", t: "Fundamentos de sistemas", d: "Interesse em como o software funciona por dentro: dados, fluxo e organização." },
                        { e: "⬔", t: "Código limpo", d: "Nomes claros, funções pequenas e organização desde o primeiro projeto." },
                        { e: "✎", t: "Aprendizado contínuo", d: "JavaScript, React e bases de programação, com prática constante." },
                      ].map((v, i) => (
                        <Reveal key={v.t} delay={i * 70}>
                          <div className="value"><span aria-hidden="true">{v.e}</span><h3>{v.t}</h3><p>{v.d}</p></div>
                        </Reveal>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ===== SKILLS ===== */}
            <section className="skills" id="skills" aria-labelledby="skills-title">
              <div className="wrap">
                <Reveal>
                  <div className="skills-head">
                    <h2 id="skills-title">O que estou construindo</h2>
                    <p className="lede" style={{marginTop:"14px"}}>Base em fundamentos web, com React no centro e TypeScript no horizonte. Sem barras de porcentagem: o nível aparece no código.</p>
                  </div>
                </Reveal>
                <ul className="stack" aria-label="Tecnologias que conheço ou estudo">
                  {SKILLS.map((s, i) => (
                    <Reveal as="li" key={s.name} delay={Math.min(i * 50, 300)} style={{listStyle:"none"}}>
                      <span className="chip" title={s.level}><i aria-hidden="true">{s.icon}</i>{s.name} <small>· {s.desc}</small></span>
                    </Reveal>
                  ))}
                </ul>
                <div className="learn">
                  <Reveal delay={0}><article><h3>Agora</h3><p>JavaScript moderno, React com componentes e CSS responsivo com Grid e Flexbox.</p></article></Reveal>
                  <Reveal delay={80}><article><h3>A seguir</h3><p>TypeScript no dia a dia, Tailwind em projetos reais e testes básicos de interface.</p></article></Reveal>
                  <Reveal delay={160}><article><h3>Sempre</h3><p>Semântica, performance, Git organizado e leitura de documentação oficial.</p></article></Reveal>
                </div>
                <p className="note">Níveis honestos: base sólida em HTML e CSS, evolução constante em JavaScript e React.</p>
              </div>
            </section>

            {/* ===== PROJETOS ===== */}
            <section id="projetos" aria-labelledby="projetos-title">
              <div className="wrap">
                <Reveal>
                  <span className="kicker">Portfólio em evolução</span>
                  <h2 id="projetos-title" style={{marginTop:"12px"}}>Projetos em destaque</h2>
                  <p className="lede" style={{marginTop:"14px"}}>Estudos conceituais para exercitar construção de interfaces. Não são trabalhos para clientes: são demonstrações do meu processo e do meu cuidado com front-end.</p>
                </Reveal>
                <div className="proj-grid">
                  <div className="col">
                    <Reveal>
                      <article className="card">
                        <div className="preview"><Preview type={PROJECTS[0].preview} /></div>
                        <div className="card-body">
                          <div className="tags"><span className="tag concept">Conceitual</span>{PROJECTS[0].tech.map(t => <span key={t} className="tag">{t}</span>)}</div>
                          <h3>{PROJECTS[0].title}</h3>
                          <p>{PROJECTS[0].desc}</p>
                          <div className="card-links">
                            <a className="link-btn" href={PROJECTS[0].demo} aria-label={"Abrir demonstração: " + PROJECTS[0].title}>Abrir demonstração →</a>
                          </div>
                        </div>
                      </article>
                    </Reveal>
                  </div>
                  <div className="col">
                    {PROJECTS.slice(1).map((p, i) => (
                      <Reveal key={p.title} delay={i * 90}>
                        <article className="card">
                          <div className="preview" style={{minHeight:"150px",padding:"20px"}}><Preview type={p.preview} /></div>
                          <div className="card-body" style={{padding:"22px"}}>
                            <div className="tags"><span className="tag concept">Conceitual</span>{p.tech.map(t => <span key={t} className="tag">{t}</span>)}</div>
                            <h3>{p.title}</h3>
                            <p>{p.desc}</p>
                            <div className="card-links">
                              <a className="link-btn" href={p.demo} aria-label={"Abrir demonstração: " + p.title}>Abrir demonstração →</a>
                            </div>
                          </div>
                        </article>
                      </Reveal>
                    ))}
                  </div>
                </div>
              </div>
            </section>

            {/* ===== EM CONSTRUÇÃO ===== */}
            <section className="next" aria-labelledby="next-title">
              <div className="wrap">
                <Reveal>
                  <h2 id="next-title">Este é apenas o começo.</h2>
                  <p className="lede" style={{marginTop:"14px"}}>Cada estudo publicado aqui marca um passo real. O portfólio cresce junto com a minha evolução, sem pressa e sem atalho.</p>
                </Reveal>
                <Reveal delay={100}>
                  <div className="next-box">
                    <div>
                      <p className="lede">No momento, aprofundo React e acessibilidade e preparo os primeiros repositórios públicos. Em breve, esta seção vira uma vitrine de projetos com código aberto.</p>
                      <div className="btn-row"><a className="btn btn-ghost" href="#contato">Acompanhar de perto →</a></div>
                    </div>
                    <ol className="road">
                      <li className="done"><span className="step" aria-hidden="true">✓</span><div><b>Fundamentos publicados</b><small>HTML, CSS e JS com exercícios revisados</small></div></li>
                      <li className="now" aria-current="step"><span className="step" aria-hidden="true">●</span><div><b>React e interfaces reais</b><small>Componentes, estados e layouts responsivos</small></div></li>
                      <li><span className="step" aria-hidden="true">3</span><div><b>Projetos com código aberto</b><small>Repositórios documentados e deployados</small></div></li>
                    </ol>
                  </div>
                </Reveal>
              </div>
            </section>

            {/* ===== CONTATO ===== */}
            <section className="contact" id="contato" aria-labelledby="contato-title">
              <div className="wrap">
                <Reveal>
                  <h2 id="contato-title">Vamos conversar?</h2>
                  <p className="lede">Aberto a estágio, júnior, freelas de estudo e feedback de quem já está na área. Respondo com atenção.</p>
                </Reveal>
                <Reveal delay={100}>
                  <div className="contact-grid">
                    {/* ↓↓↓ PREENCHA AQUI: troque os hrefs pelos seus links reais ↓↓↓ */}
                    <div className="c-card c-card-split">
                      <button type="button" className="c-link c-link-btn" onClick={copyEmail} aria-label="Copiar endereço de e-mail">
                        <span className="ic" aria-hidden="true">✉</span>
                        <span><b>E-mail</b><small aria-live="polite">{copied ? "✓ E-mail copiado!" : "wesleysantosmelo2022@gmail.com"}</small></span>
                      </button>
                      <input id="email-field" className="email-field" type="text" readOnly value="wesleysantosmelo2022@gmail.com" onFocus={(e) => e.target.select()} aria-label="Endereço de e-mail. Pressione Ctrl+C para copiar" />
                    </div>
                    <span className="c-card" aria-label="GitHub, link em breve">
                      <span className="ic" aria-hidden="true">⌁</span>
                      <span><b>GitHub</b><small>link em breve</small></span>
                    </span>
                    <span className="c-card" aria-label="LinkedIn, link em breve">
                      <span className="ic" aria-hidden="true">in</span>
                      <span><b>LinkedIn</b><small>link em breve</small></span>
                    </span>
                  </div>
                  <p className="note" style={{textAlign:"center"}}>GitHub e LinkedIn serão vinculados aqui assim que os perfis estiverem prontos. Sem URLs inventadas.</p>
                </Reveal>
              </div>
            </section>
          </main>

          <footer>
            <div className="wrap foot">
              <span>© 2026 Wesley Santos de Melo · Feito com React em um único HTML</span>
              <button type="button" className="replay" onClick={replay}>Rever abertura ↺</button>
              <a href="#inicio" style={{textDecoration:"none"}}>Voltar ao topo ↑</a>
            </div>
          </footer>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
